<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
  --navy:#1e3a8a; --blue:#2563eb; --in:#2563eb; --out:#ea580c; --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
  --chip:#eef2ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:900;letter-spacing:-.3px}
.dev{display:flex;gap:10px;font-size:13px;flex-wrap:wrap}
.dev span{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#9ca3af;vertical-align:1px}
.dot.on{background:#4ade80}.dot.off{background:#f87171}
header .sp{flex:1}
header .who{font-size:13px;opacity:.85}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 12px}
nav{display:flex;gap:4px;padding:10px 18px 0;flex-wrap:wrap;background:var(--bg)}
nav button{border:0;background:transparent;padding:10px 16px;border-radius:10px 10px 0 0;font-weight:700;color:var(--sub)}
nav button.on{background:var(--card);color:var(--navy);box-shadow:0 -1px 0 var(--line) inset}
main{padding:0 18px 40px}
.panel{background:var(--card);border-radius:0 12px 12px 12px;padding:18px;min-height:60vh}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:9px 16px;font-weight:700}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=month],select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:110px;resize:vertical}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:14px;color:var(--ink)}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.muted{color:var(--sub);font-size:13px}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 8px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--sub);font-weight:700;background:#fafbfc;position:sticky;top:0}
tr.click:hover{background:#f8fafc;cursor:pointer}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:2px 7px;font-weight:700}
.t-in{background:#dbeafe;color:var(--in)}.t-out{background:#ffedd5;color:var(--out)}
.t-ok{background:#dcfce7;color:var(--ok)}.t-bad{background:#fee2e2;color:var(--bad)}.t-wait{background:#fef3c7;color:var(--warn)}
.t-gray{background:#f3f4f6;color:#4b5563}
.lfm{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}.lfm.now{border-color:#16a34a;background:#f0fdf4}
.lfw{width:48px;flex:none;text-align:center;font-weight:900;color:var(--navy);font-size:13.5px;padding-top:6px}.lfw b{color:#16a34a;font-size:11px}
.lft td,.lft th{padding:5px 6px}.lfc{width:34px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:900;color:#fff;font-size:16px}
.lfc.on{background:#16a34a;border-color:#16a34a}
.blive{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
@media(max-width:1100px){.blive{grid-template-columns:1fr}}
.blist{display:flex;flex-direction:column;gap:6px;max-height:75vh;overflow:auto}
.broute{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.broute.on{border-color:var(--blue);background:#eff6ff}.broute:hover{border-color:#93c5fd}
.bmap{height:62vh;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#e5e7eb}
.btl{position:relative;padding-left:4px}
.bst{display:flex;gap:12px;position:relative;padding-bottom:14px}
.bst:not(:last-child)::before{content:'';position:absolute;left:15px;top:30px;bottom:0;width:4px;background:#cbd5e1;border-radius:2px}
.bst.done:not(:last-child)::before{background:#16a34a}
.bdot{width:34px;height:34px;flex:none;border-radius:50%;background:#fff;border:4px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#64748b;z-index:1;box-sizing:border-box}
.bst.done .bdot{background:#16a34a;border-color:#16a34a;color:#fff}.bst.next .bdot{border-color:#f59e0b;color:#b45309;box-shadow:0 0 0 5px #fef3c7}
.bbody{flex:1;min-width:0;padding-top:4px}.bhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btime{color:var(--navy);font-size:15px}.bname{font-size:15.5px}
.bkids{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.blab{font-size:11.5px;font-weight:900;border-radius:5px;padding:2px 6px}.blab.on{background:#dbeafe;color:#1d4ed8}.blab.off{background:#ffedd5;color:#c2410c}
.bkid{border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:13.5px;font-weight:700;background:#fff;display:inline-flex;gap:4px;align-items:center}
.bkid small{color:var(--sub);font-weight:500}.bkid.abs{text-decoration:line-through;opacity:.6}
.bkid i{font-style:normal;font-size:11px;border-radius:4px;padding:0 4px}.bkid .kb{background:#fee2e2;color:#dc2626}.bkid .kg{background:#dcfce7;color:#15803d}.bkid .kw{background:#fef3c7;color:#b45309}
.bcar{margin:-4px 0 12px 44px;background:#ecfdf5;border:1px dashed #16a34a;border-radius:10px;padding:7px 10px;font-size:13.5px;display:flex;gap:6px;align-items:center}
.bcar span{font-size:20px;animation:bcar 1.2s ease-in-out infinite alternate}@keyframes bcar{to{transform:translateX(6px)}}
.bed{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}@media(max-width:1100px){.bed{grid-template-columns:1fr}}
.bes{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}.bes.placing{border-color:#f59e0b;background:#fffbeb}
.besn{width:42px;flex:none;font-weight:900;color:var(--navy);text-align:center;padding-top:8px;font-size:13px}
.bes input[type=time]{width:110px}
#driveOv{position:fixed;inset:0;z-index:80;background:#f8fafc;overflow:auto;font-size:16px}
.dvh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:14px 16px;font-size:18px}
.dvx{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;width:40px;height:40px;font-size:18px}
.dvb{padding:14px 16px 40px;max-width:640px;margin:0 auto}
.dvr{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;font-size:17px}
.dvgo,.dvend{display:block;width:100%;border:0;border-radius:16px;padding:20px;font-size:21px;font-weight:900;color:#fff;background:#16a34a;margin:6px 0}.dvend{background:#dc2626;margin-top:16px}
.dvstat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-weight:700}
.dvdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#16a34a;animation:dvp 1s infinite}@keyframes dvp{50%{opacity:.25}}
.stcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stcards small{font-size:14px;font-weight:700;margin-left:2px}
.stbars{display:flex;gap:6px;align-items:flex-end;height:170px;overflow-x:auto;padding-top:4px}
.stbar{all:unset;cursor:pointer;flex:1;min-width:44px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.stbf{width:70%;background:#93c5fd;border-radius:6px 6px 0 0;min-height:4px}.stbar.on .stbf,.stbar:hover .stbf{background:var(--blue)}
.stbn{font-weight:900;font-size:14px}.stbl{font-size:12px;color:var(--sub);white-space:nowrap}
.stcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.stcol{border:1px solid var(--line);border-radius:12px;padding:8px}.stcolh{display:flex;justify-content:space-between;padding:2px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}.stcolh b{color:var(--navy)}
.stkid{padding:5px 6px;border-radius:7px;cursor:pointer;font-size:14px}.stkid:hover{background:#f1f5f9}.stkid.inline{display:inline-block;border:1px solid var(--line)}
.stfams{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;margin-bottom:10px}
.edyear{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(520px,100%),1fr));gap:12px}
.edmon{border:1px solid var(--line);border-radius:12px;padding:10px}.edmon.cur{border-color:#16a34a;box-shadow:0 0 0 2px #bbf7d0 inset}
.edmh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.edmh b{font-size:16px;color:var(--navy)}
.edweeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.edc{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff;min-width:0}
.edc:hover{border-color:#93c5fd}.edc.now{border-color:#16a34a;box-shadow:0 0 0 2px #bbf7d0}
.edth{position:relative;aspect-ratio:16/9;border-radius:7px;background:#f1f5f9 center/cover;display:flex;align-items:center;justify-content:center}
.edc.has .edth{background-color:#1e293b}
.edplay{width:34px;height:34px;border-radius:50%;background:rgba(220,38,38,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;padding-left:2px;box-sizing:border-box}
.edico{font-size:26px}.edplus{font-size:24px;color:#94a3b8;font-weight:300}
.edtt{font-size:12px;font-weight:800;color:var(--sub)}.ednow{background:#16a34a;color:#fff;border-radius:5px;padding:0 5px;font-size:11px}
.edname{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edadd5{border:1px dashed var(--line);background:#fff;border-radius:10px;color:var(--sub);font-size:12px}
#tuBody td{padding:5px 6px;font-size:13.5px}#tuBody th{white-space:nowrap}
#tuBody input,#tuBody select{padding:5px 6px;font-size:13px;border-radius:7px}
#tuBody tr.un td:first-child{box-shadow:3px 0 0 var(--bad) inset}#tuBody tr.skip{opacity:.55}
#tuBody .num{text-align:right;white-space:nowrap}#tuBody .dd{color:var(--warn);font-weight:800}
#tuBody .auto{font-size:11.5px;color:#b45309;margin-top:3px;line-height:1.35}
.belt{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px;white-space:nowrap}
.belt i{display:inline-block;width:22px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px}
.stat{font-size:28px;font-weight:900}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.month td,.month th{padding:4px 5px;text-align:center;font-size:12.5px;border:1px solid #eef0f3}
.month td.nm{text-align:left;white-space:nowrap;font-weight:700;position:sticky;left:0;background:#fff;z-index:1}
.month th.nm{position:sticky;left:0;z-index:2}
.month .we{background:#fdf2f2}.month .sat{background:#eff6ff}
.month .o{color:var(--ok);font-weight:900}.month .a{color:var(--warn);font-weight:700}.month .lv{color:#9ca3af}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal .box{background:#fff;border-radius:14px;padding:20px;width:min(640px,100%)}
.form{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
.form label{font-size:14px;color:var(--sub);font-weight:700}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:10px;z-index:99;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#login{max-width:460px;margin:60px auto;background:#fff;border-radius:16px;padding:26px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
#login h1{margin:0 0 6px;font-size:22px}
#login input{width:100%;margin:6px 0}
.preview{white-space:pre-wrap;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}.bar i{display:block;height:8px;background:var(--ok)}
.kids{display:flex;flex-wrap:wrap;gap:6px;max-height:280px;overflow:auto;padding:4px}
.kid{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13.5px;background:#fff}
.kid.on{background:#dbeafe;border-color:#93c5fd}

/* 카톡 느낌 문자 */
.chat{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 175px);min-height:480px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.clist{border-right:1px solid var(--line);display:flex;flex-direction:column;background:#fff;min-height:0}
.chead{display:flex;align-items:center;padding:12px}
.clistBody{overflow:auto;flex:1}
.citem{display:flex;gap:10px;padding:10px 12px;cursor:pointer;align-items:center}
.citem:hover{background:#f5f5f5}.citem.on{background:#eef2f7}
.cav{width:44px;height:44px;border-radius:16px;background:#9bbbd4;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex:none}
.cav.sm{width:38px;height:38px;border-radius:14px;font-size:15px}
.cmid{flex:1;min-width:0}.cname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.cprev{color:#6b7280;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cbadge{background:#f43f5e;color:#fff;border-radius:99px;font-size:11.5px;font-weight:800;padding:1px 7px;line-height:17px}
.croom{display:flex;flex-direction:column;background:#b2c7da;min-height:0}
.croomHead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(178,199,218,.95);border-bottom:1px solid rgba(0,0,0,.06)}
.cbody{flex:1;overflow:auto;padding:14px 16px}
.cday{text-align:center;margin:14px 0}.cday span{background:rgba(0,0,0,.18);color:#fff;font-size:12px;padding:4px 12px;border-radius:99px}
.cmsg{display:flex;gap:8px;margin:6px 0;align-items:flex-start}
.cmsg.me{justify-content:flex-end;align-items:flex-end}
.cwho{font-size:12.5px;color:#374151;margin-bottom:3px}
.cb{background:#fff;border-radius:4px 14px 14px 14px;padding:8px 11px;max-width:460px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.cb.me{background:#fee500;border-radius:14px 4px 14px 14px}
.cb.att{background:#fff7b3}
.ctag{font-size:11px;color:#6b7280;margin-bottom:3px;font-weight:700}
.cmeta{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:#4b5563;gap:1px;white-space:nowrap}
.cmsg:not(.me) .cmeta{align-items:flex-start}
.cfail{color:#dc2626;font-weight:800}.cwait{color:#1d4ed8;font-weight:700}.cun{color:#f59e0b}
.creply{border:1px solid #93c5fd;background:#fff;color:#1d4ed8;border-radius:99px;font-size:12px;font-weight:700;padding:2px 9px;margin-bottom:3px}.creply:hover,.creply.on{background:#2563eb;color:#fff}
.cb.pick{cursor:pointer}.cb.pick:hover{box-shadow:0 0 0 2px #93c5fd}.cb.sel{box-shadow:0 0 0 3px #2563eb}
.csend:disabled{opacity:.45}
.cinput{background:#fff;border-top:1px solid var(--line)}
.cinput textarea{flex:1;min-height:44px;max-height:160px;border:0;outline:0;resize:none;padding:6px 4px;font-size:15px}
.csend{background:#fee500;border:0;border-radius:8px;padding:10px 16px;font-weight:800;color:#3c1e1e}
.cempty{margin:auto;text-align:center;color:#334155;font-size:15px;line-height:1.7;padding:40px}
@media (max-width:800px){.chat{grid-template-columns:1fr}.croom{min-height:70vh}}
@media (max-width:700px){.form{grid-template-columns:1fr}.dev{width:100%}}
</style>
</head>
<body>

<!-- ───────── 로그인 ───────── -->
<div id="login" class="hidden">
  <h1>🥋 정도 출결 PC 관리</h1>
  <p class="muted">문자 폰·키오스크와 같은 출결 데이터를 PC에서 보고 고쳐요.</p>
  <div id="codeBox">
    <h3>① 연결 코드 (처음 한 번)</h3>
    <p class="muted">관장님 폰 출결 앱 → 설정 맨 아래 <b>💻 PC에서 관리하기</b>의 코드를 붙여넣으세요. ([카톡으로 PC에 보내기]를 누르면 편해요)</p>
    <input type="text" id="codeIn" placeholder="JD1-…">
    <details style="margin:6px 0"><summary class="muted">코드가 안 되면: 파이어베이스 웹 설정 붙여넣기</summary>
      <textarea id="cfgIn" placeholder="const firebaseConfig = { apiKey: ..., projectId: ... }"></textarea>
    </details>
  </div>
  <h3>② 도장 계정</h3>
  <input type="text" id="emailIn" placeholder="이메일 (출결 앱 로그인과 같아요)" autocomplete="username">
  <input type="password" id="pwIn" placeholder="비밀번호" autocomplete="current-password">
  <div class="row" style="margin-top:10px"><button class="btn grow" id="loginBtn">로그인</button></div>
  <p class="muted" id="loginMsg"></p>
  <p class="muted"><a href="#" id="resetCode">연결 코드 다시 넣기</a></p>
</div>

<!-- ───────── 본 화면 ───────── -->
<div id="app" class="hidden">
  <header>
    <h1>🥋 정도 출결 PC</h1>
    <div class="dev"><span id="devServer"><i class="dot"></i>문자 폰</span><span id="devKiosk"><i class="dot"></i>키오스크</span></div>
    <div class="sp"></div>

/* ═════════════ 학년 (앱과 같은 계산) ═════════════ */

// 기사님 링크: ?c=JD1-…(연결 코드)&e=이메일 → 코드 저장하고 이메일 미리 채우기
{ const q = new URLSearchParams(location.search); const c = q.get('c'), em = q.get('e');

    unsubs.push(onSnapshot(collection(db, 'students'), snap => { S.students = snap.docs.map(toStudent); if (BUS.drive) driveDraw(); }, () => {}));

  unsubs.push(onSnapshot(collection(db, 'students'), snap => { S.students = snap.docs.map(toStudent); rerender(['today','roster','bulk','month','absent','fee','unpaid','stats','life']); }, err));
  unsubs.push(onSnapshot(query(collection(db, 'events'), where('day', '==', today())), snap => { S.todayEv = snap.docs.map(d => ({ id: d.id, ...d.data() })); rerender(['today']); }, err));
  unsubs.push(onSnapshot(collection(db, 'groups'), snap => { S.groups = snap.docs.map(d => ({ id: d.id, name: d.get('name') || '', ids: d.get('studentIds') || [] })); rerender(['bulk']); }, err));

const active = () => S.students.filter(s => s.status === 'ACTIVE');

function renderDev(){

/* ═════════════ 탭 ═════════════ */
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.t; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); render(); };

/* ─── 🧸 캐릭터 넣기 (마이룸 · 제미타 공용) ───

const JAVAMODEL=(()=>{
const num=s=>{s=String(s).trim().replace(/\(float\)|\(double\)/g,'').replace(/(\d)[FfDd]\b/g,'$1').replace(/Math\.PI/g,'('+Math.PI+')').replace(/Math\.toRadians\(([^)]*)\)/g,'(($1)*'+Math.PI/180+')');

const args=s=>{const out=[];let d=0,cur='';for(const ch of s){if(ch==='('){d++;cur+=ch}else if(ch===')'){d--;cur+=ch}else if(ch===','&&d===0){out.push(cur);cur=''}else cur+=ch}if(cur.trim())out.push(cur);return out.map(x=>x.trim())};
// 괄호 짝 맞춰서 함수 호출 인자 꺼내기
function calls(src,name){const out=[];let i=0;const re=new RegExp('([\\w.\\[\\]]+)\\s*\\.\\s*'+name+'\\s*\\(','g');let m;while((m=re.exec(src))){let j=re.lastIndex,d=1;while(j<src.length&&d){if(src[j]==='(')d++;else if(src[j]===')')d--;j++}out.push({obj:m[1].replace(/^this\./,''),a:args(src.slice(re.lastIndex,j-1)),at:m.index});i=j}return out}
function parseClass(name,src){const P={},order=[];let tw=64,th=64;const T=src.match(/texture(?:Width)\s*=\s*([\d.]+)/),U=src.match(/texture(?:Height)\s*=\s*([\d.]+)/);if(T)tw=+T[1];if(U)th=+U[1];
  const part=n=>{n=n.replace(/^this\./,'');if(!P[n]){P[n]={n,pv:[0,0,0],rot:[0,0,0],cubes:[],kids:[],par:null,uv:[0,0],mir:false};order.push(n)}return P[n]};
  // 새 부위

/* ─── 공통: 찾기·고르기·정렬 ─── */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const CHO_KEYS = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ';
const BASE_CHO = { 'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ' };
const choseong = s => [...s].map(c => { const k = c.charCodeAt(0) - 0xAC00; return k >= 0 && k < 11172 ? CHO[Math.floor(k / 588)] : c; }).join('');
const cho1 = s => { const c = choseong(s)[0] || ''; return BASE_CHO[c] || c; };
/** 앱과 같은 찾기: 초성만 치면 성 또는 이름 첫 글자부터, 그 밖엔 이름에 들어 있으면 */
function nameMatch(name, q){
  const t = q.replace(/\s/g, ''); if (!t) return true;
  if ([...t].every(c => c >= 'ㄱ' && c <= 'ㅎ')){ const init = choseong(name).split('').map(c => BASE_CHO[c] || c).join(''); const want = [...t].map(c => BASE_CHO[c] || c).join(''); return init.startsWith(want) || init.slice(1).startsWith(want); }
  if (/^\d+$/.test(t)) return false;
  return name.includes(t);
}
/** 나이(세): 나이가 저장돼 있으면 그대로, 없으면 학년 글자로 */
const ageKey = s => curAge(s) || ageOf(gradeOf(s)) || 0;
const newF = () => ({ q: '', cho: new Set(), grades: new Set(), ages: new Set(), belts: new Set(), sort: 'name' });
function applyF(list, F){
  return list.filter(s =>
    (!F.q || nameMatch(s.name, F.q) || (/\d{3,}/.test(F.q) && (s.attendNo.includes(F.q) || s.phones.some(x => normPhone(x).includes(F.q.replace(/\D/g, '')))))) &&
    (!F.cho.size || F.cho.has(cho1(s.name)) || F.cho.has(cho1(givenName(s.name)))) &&
    (!F.grades.size || F.grades.has(gradeOf(s))) &&
    (!F.ages.size || F.ages.has(String(ageKey(s)))) &&
    (!F.belts.size || F.belts.has(normBelt(s.belt) || '띠 없음')));
}
const SORTS = [['name','가나다순'],['nameDesc','가나다 거꾸로'],['ageAsc','나이 어린 순'],['ageDesc','나이 많은 순'],['beltDesc','띠 높은 순'],['beltAsc','띠 낮은 순'],['no','출결번호 순']];
function sortF(list, sort){
  const nm = (a, b) => a.name.localeCompare(b.name, 'ko');
  const ak = s => ageKey(s) || 999;
  const f = {
    name: nm, nameDesc: (a, b) => -nm(a, b),
    ageAsc: (a, b) => ak(a) - ak(b) || nm(a, b),
    ageDesc: (a, b) => (ageKey(b) || -1) - (ageKey(a) || -1) || nm(a, b),
    beltDesc: (a, b) => (beltRank(b.belt) % 9999) - (beltRank(a.belt) % 9999) || nm(a, b),
    beltAsc: (a, b) => beltRank(a.belt) - beltRank(b.belt) || nm(a, b),
    no: (a, b) => (parseInt(a.attendNo, 10) || 1e9) - (parseInt(b.attendNo, 10) || 1e9) || nm(a, b),
  }[sort] || nm;
  return [...list].sort(f);
}
/** 찾기 칸 + 초성·학년·나이·띠 버튼 + 정렬 (누르면 목록만 다시 그림 → 한글 입력이 안 끊김) */

/* ─── 통합관리 띠와 비교·맞추기 (PC에서 직접 받아서 비교) ─── */
const BS_URL = 'https://taekwondo-wordgame-default-rtdb.asia-southeast1.firebasedatabase.app/apps/pub_beltsync/data/blob.json';
const b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function bsFetch(pw){
  const r = await fetch(BS_URL, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status);
  const o = await r.json(); if (!o) throw new Error('통합관리에서 아직 띠를 보내지 않았어요');
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64u8(o.s), iterations: o.n || 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  let plain; try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u8(o.i) }, key, b64u8(o.d)); } catch(e){ throw new Error('비밀번호가 통합관리와 달라요'); }
  const d = JSON.parse(new TextDecoder().decode(plain));
  const list = Array.isArray(d.l) ? d.l.map(x => ({ n: String(x.n || '').trim(), g: String(x.g || '').trim(), b: normBelt(x.b) })) : Object.entries(d.b || {}).map(([n, b]) => ({ n: n.trim(), g: '', b: normBelt(b) }));
  return { t: o.t || d.t, list };
}
/* 출결에서 직접 고친(📌) 띠 → 통합관리로 (통합관리가 1분마다 받아 감). 비밀번호는 [통합관리 띠와 비교]에서 한 번 넣으면 기억 */
const BS_BACK = BS_URL.replace('/blob.json', '/back.json');
let bsBackSig = '';
const u8b64 = u8 => { let x = ''; u8.forEach(c => x += String.fromCharCode(c)); return btoa(x); };
async function bsEncrypt(pw, text){
  const enc = new TextEncoder(), n = 150000, salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
  const d = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text)));
  return { v: 1, n, t: Date.now(), s: u8b64(salt), i: u8b64(iv), d: u8b64(d) };
}
async function bsPushBack(force){
  const pw = lsGet('jdpc_beltpw'); if (!pw || !S.students.length) return;
  const l = S.students.filter(s => s.status !== 'LEFT' && s.beltManual && s.belt).sort((a, b) => a.id < b.id ? -1 : 1)
    .map(s => ({ n: s.name.trim(), g: gradeOf(s), a: curAge(s), b: normBelt(s.belt), at: s.beltAt || 1 }));
  const sig = pw.length + JSON.stringify(l); if (!force && sig === bsBackSig) return;
  try { const r = await fetch(BS_BACK, { method: 'PUT', body: JSON.stringify(await bsEncrypt(pw, JSON.stringify({ t: Date.now(), l }))) }); if (r.ok) bsBackSig = sig; } catch(e){}
}
setInterval(() => bsPushBack(false), 120000);
function catOf(raw, age){
  if (age > 0) return age <= 7 ? 0 : age <= 13 ? 1 : age <= 16 ? 2 : age <= 19 ? 3 : 4;
  const g = String(raw || '').replace(/\s/g, ''); if (!g) return -1;
  if (/유치|세|살/.test(g)) return 0; if (g.startsWith('중')) return 2; if (g.startsWith('고')) return 3; if (g.includes('성인')) return 4; if (g.startsWith('초') || g.includes('학년')) return 1; return -1;
}
function gradeKeyOf(raw){
  const g = String(raw || '').replace(/\s/g, ''); const m = g.match(/(\d+)/); if (!m) return 99; const n = +m[1];
  if (/세|살/.test(g)) return n; if (g.startsWith('중')) return 13 + n; if (g.startsWith('고')) return 16 + n; if (g.includes('학년') || g.startsWith('초')) return 7 + n; return 99;
}
/** 앱(문자 폰)과 똑같은 규칙으로 아이마다 통합관리 띠를 찾음 → { id: {belt, how} } */
function matchBelts(list){
  const out = {};
  const byName = {}; list.filter(e => e.b).forEach(e => (byName[e.n] = byName[e.n] || []).push(e));
  const groups = {}; S.students.filter(s => s.status !== 'LEFT').forEach(s => (groups[s.name.trim()] = groups[s.name.trim()] || []).push(s));
  Object.entries(groups).forEach(([name, kids]) => {
    const cands = byName[name]; if (!cands) return;
    const sAge = s => curAge(s) || gradeKeyOf(gradeOf(s)); const sCat = s => catOf(gradeOf(s), curAge(s));
    if (kids.length === 1 && cands.length === 1){
      const sc = sCat(kids[0]), ec = catOf(cands[0].g, 0);
      out[kids[0].id] = sc >= 0 && ec >= 0 && sc !== ec ? { belt: '', how: `통합관리 ${name}(${cands[0].g})은 다른 아이 같아요` } : { belt: cands[0].b, how: '' };
      return;
    }
    const left = [...cands], rest = [];
    kids.forEach(s => {
      let hit = left.filter(e => sAge(s) < 99 && gradeKeyOf(e.g) === sAge(s));
      if (hit.length !== 1) hit = left.filter(e => sCat(s) >= 0 && catOf(e.g, 0) === sCat(s));
      if (hit.length === 1){ out[s.id] = { belt: hit[0].b, how: `이름 같은 아이 · 학년으로 구분(${hit[0].g})` }; left.splice(left.indexOf(hit[0]), 1); } else rest.push(s);
    });
    if (rest.length){
      if (rest.length === left.length){ const ls = [...left].sort((a, b) => beltRank(a.b) - beltRank(b.b)); [...rest].sort((a, b) => sAge(a) - sAge(b)).forEach((s, i) => out[s.id] = { belt: ls[i].b, how: '이름 같은 아이 · 나이 순으로 짝지음' }); }
      else rest.forEach(s => out[s.id] = { belt: '', how: '이름 같은 아이를 구분 못 함' });
    }
  });
  return out;
}
function beltSyncModal(){

/* ─── 📞 전화 대상 (연락 없이 2일 이상 연달아 결석) ─── */
const HOLI = {'2026-01-01':1,'2026-02-16':1,'2026-02-17':1,'2026-02-18':1,'2026-03-01':1,'2026-03-02':1,'2026-05-01':1,'2026-05-05':1,'2026-05-24':1,'2026-05-25':1,'2026-06-03':1,'2026-06-06':1,'2026-07-17':1,'2026-08-15':1,'2026-08-17':1,'2026-09-24':1,'2026-09-25':1,'2026-09-26':1,'2026-10-03':1,'2026-10-05':1,'2026-10-09':1,'2026-12-25':1,
  '2027-01-01':1,'2027-02-06':1,'2027-02-07':1,'2027-02-08':1,'2027-02-09':1,'2027-03-01':1,'2027-05-01':1,'2027-05-03':1,'2027-05-05':1,'2027-05-13':1,'2027-06-06':1,'2027-07-17':1,'2027-07-19':1,'2027-08-15':1,'2027-08-16':1,'2027-09-14':1,'2027-09-15':1,'2027-09-16':1,'2027-10-03':1,'2027-10-04':1,'2027-10-09':1,'2027-10-11':1,'2027-12-25':1,'2027-12-27':1};
const shiftDay = (d, n) => { const t = new Date(d + 'T12:00:00'); t.setDate(t.getDate() + n); return dayOf(t.getTime()); };
const CS = { ev: [], ab: [], hol: {}, loadedDay: '' };
function isOff(d){ const c = CS.hol[d]; if (c === '수업') return false; const w = new Date(d + 'T12:00:00').getDay(); return w === 0 || w === 6 || !!c || !!HOLI[d]; }
async function loadCall(){
  CS.loadedDay = today(); const from = shiftDay(today(), -70);
  const [e, a, h] = await Promise.all([
    getDocs(query(collection(db, 'events'), where('day', '>=', from))),
    getDocs(query(collection(db, 'absences'), where('day', '>=', from))),
    getDoc(doc(db, 'config', 'holidays')),
  ]);
  CS.ev = e.docs.map(d => d.data()).filter(x => x.type === 'IN'); CS.ab = a.docs.map(d => d.data()); CS.hol = (h.exists() && h.get('days')) || {};
}
function callList(){
  const yest = shiftDay(today(), -1);
  const att = {}; CS.ev.forEach(e => (att[e.studentId] = att[e.studentId] || new Set()).add(e.day));
  S.todayEv.filter(e => e.type === 'IN').forEach(e => (att[e.studentId] = att[e.studentId] || new Set()).add(e.day));
  const exc = {}; CS.ab.forEach(a => (exc[a.studentId] = exc[a.studentId] || new Set()).add(a.day));
  const from70 = shiftDay(today(), -70), recent = shiftDay(today(), -14);
  return active().map(s => {
    const days = att[s.id] || new Set(), ex = exc[s.id] || new Set();
    const last = [...days].filter(d => d <= today()).sort().pop();
    if (!last) return null;
    if (days.has(today())) return null;
    let gap = 0; for (let d = shiftDay(last, 1); d <= yest; d = shiftDay(d, 1)) if (!isOff(d) && !ex.has(d)) gap++;
    let open = 0, came = 0; const st = s.joinedMonth && s.joinedMonth + '-01' > from70 ? s.joinedMonth + '-01' : from70;
    for (let d = st; d < recent; d = shiftDay(d, 1)) if (!isOff(d) && !ex.has(d)){ open++; if (days.has(d)) came++; }
    const usual = open >= 5 ? came / open : 0.8;
    const need = gap >= 2 && (usual >= 0.5 || gap * Math.max(usual, 0.3) >= 1.6);
    return need ? { s, gap, last, usual } : null;
  }).filter(Boolean).sort((a, b) => b.gap - a.gap);
}
async function rCall(p){
  p.innerHTML = '<p class="muted">출석 기록 읽는 중…</p>';

      <td>${x.s.phones.map((ph, i) => `${esc(x.s.phoneLabels[i] || '보호자')} <b>${esc(prettyPhone(normPhone(ph)))}</b>`).join('<br>')}</td>
      <td><button class="btn small ghost" data-cs="${x.s.id}">✉️ 문자</button> <button class="btn small" data-ca="${x.s.id}">결석 등록</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">전화할 아이가 없어요 👍</td></tr>'}
    </table></div>`;
  p.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => openChatWith(S.students.find(s => s.id === b.dataset.cs)));

const givenName = n => (n.trim().length === 3 && /^[가-힣]+$/.test(n.trim())) ? n.trim().slice(1) : n.trim();
function buildReply(tpl, names, label){
  const d = today(); const dateText = `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일`;
  const ho = !label || label === '보호자' ? '보호자님' : label;
  return tpl.split('{이름}').join(names.map(givenName).join(', ')).split('{성명}').join(names.join(', ')).split('{호칭}').join(ho).split('{날짜}').join(dateText).trim();
}
function buildItems(tpl, kids, allPhones){
  const byPhone = new Map(), noPhone = [];
  kids.forEach(s => {
    const all = []; s.phones.forEach((p, i) => { const n = normPhone(p); if (n.length >= 9 && !all.some(x => x[0] === n)) all.push([n, s.phoneLabels[i] || '보호자']); });
    const use = allPhones ? all : all.slice(0, 1);
    if (!use.length) noPhone.push(s.name);
    use.forEach(([p, l]) => { if (!byPhone.has(p)) byPhone.set(p, []); byPhone.get(p).push([s, l]); });
  });
  const list = [...byPhone].map(([p, arr]) => ({ n: arr.map(x => x[0].name).join(', '), p, t: buildReply(tpl || '', arr.map(x => x[0].name), arr[0][1]) }));
  return { list, noPhone };
}

const MS = { month: thisMonth(), ev: [], ab: [], hol: {}, loaded: '' , unsub: [] };
function loadMonth(){
  MS.unsub.forEach(u => u()); MS.unsub = []; MS.loaded = MS.month;
  const from = MS.month + '-01', to = MS.month + '-31';
  MS.unsub.push(onSnapshot(query(collection(db, 'events'), where('day', '>=', from), where('day', '<=', to)), snap => { MS.ev = snap.docs.map(d => d.data()); if (S.tab === 'month') render(); }));
  MS.unsub.push(onSnapshot(query(collection(db, 'absences'), where('day', '>=', from), where('day', '<=', to)), snap => { MS.ab = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (S.tab === 'month' || S.tab === 'absent') render(); }));
  getDoc(doc(db, 'config', 'holidays')).then(d => { MS.hol = (d.exists() && d.get('days')) || {}; if (S.tab === 'month') render(); }).catch(() => {});
}
function monthTable(){
  const [y, m] = MS.month.split('-').map(Number); const n = new Date(y, m, 0).getDate();
  const days = Array.from({ length: n }, (_, i) => `${MS.month}-${pad(i + 1)}`);
  const kids = S.students.filter(s => (s.joinedMonth || '0000') <= MS.month && (s.status !== 'LEFT' || !s.leftMonth || s.leftMonth >= MS.month)).sort(byName);
  const inSet = new Set(MS.ev.filter(e => e.type === 'IN').map(e => e.studentId + '|' + e.day));
  const abMap = new Map(MS.ab.map(a => [a.studentId + '|' + a.day, a.reason || '결석']));

  return { days, rows, abMap };
}

function phoneOwners(p){

function convTitle(p){
  const o = phoneOwners(p);
  if (!o.length) return { name: prettyPhone(p), sub: '등록 안 된 번호' };
  const names = [...new Set(o.map(x => x.s.name))].join(', ');
  return { name: `${names} ${o[0].label}`, sub: `${o.map(x => x.s.name).filter((v, i, a) => a.indexOf(v) === i).join(', ')} · ${prettyPhone(p)}` };

/** 번호별 대화: 받은 문자 + 보낸 단체/PC 문자 + (선택) 등원·하원 알림 */
function buildConvs(){
  const m = new Map();
  const put = (p, msg) => { p = normPhone(p); if (p.length < 9) return; if (!m.has(p)) m.set(p, []); m.get(p).push(msg); };
  S.inbox.forEach(x => {
    put(x.from, { at: x.at || 0, me: false, text: x.body || '', unread: !x.handled, id: x.id });
    if (x.reply) put(x.from, { at: (x.at || 0) + 1, me: true, text: x.reply, st: x.replyError ? 'fail' : 'ok', err: x.replyError });
  });
  S.bulkAll.forEach(j => (j.items || []).forEach((it, i) => {
    const r = (j.results || {})[i];
    put(it.p, { at: j.createdMs || 0, me: true, text: it.t || '', st: r === 'OK' ? 'ok' : r ? 'fail' : (j.status === 'DONE' ? 'fail' : 'wait'), err: r && r !== 'OK' ? r : '', title: j.title });
  }));

}

  if (!confirm(`'${name}' 방에서 나갈까요?\n지금까지 대화가 목록에서 사라져요. 새 문자가 오면 방이 다시 생겨요.\n(실제 문자 기록은 지워지지 않고, [나간 대화방 다시 보기]로 되살릴 수 있어요)`)) return;
  await setDoc(doc(db, 'config', 'pcChat'), { hidden: { [key]: Date.now() } }, { merge: true });
  CH.cur = ''; toast('방에서 나갔어요');
}

function groupJobs(){ return S.bulkAll.filter(j => (j.items || []).length > 1 && !j.parent && !String(j.title || '').startsWith('💬') && !(S.chatGone || {})[j.id]); }
/* 단체방 해체: 단체방이 목록에서 완전히 없어져요 (답장은 각 어머님 1:1 대화방에 그대로 남아요). 모든 PC에 똑같이 */
async function dissolveRoom(j){
  if (!confirm(`'${j.title || '단체방'}' 방을 해체할까요?\n단체방이 목록에서 없어져요. 받은 답장·보낸 문자는 각 어머님 1:1 대화방에 그대로 남아요.`)) return;
  await setDoc(doc(db, 'config', 'pcChat'), { gone: { [j.id]: Date.now() } }, { merge: true });
  CH.cur = ''; toast('단체방을 해체했어요');
}
/** 방에 들어갈 것: 내가 보낸 단체 문자 + 보낸 뒤 그 사람들이 보낸 답장 + 내가 그 사람에게 따로 보낸 답장 */
function groupMsgs(j){
  const phones = new Map((j.items || []).map(it => [normPhone(it.p), it.n]));
  const from = j.createdMs || 0;
  const res = j.results || {}; const n = (j.items || []).length;
  const ok = Object.values(res).filter(v => v === 'OK').length, fail = Object.values(res).filter(v => v !== 'OK').length;
  const out = [{ at: from, me: true, all: true, text: (j.items[0] || {}).t || '', st: j.status === 'DONE' ? (fail ? 'fail' : 'ok') : 'wait', info: `${n}명에게 · 성공 ${ok}${fail ? ` · 실패 ${fail}` : ''}${j.status !== 'DONE' ? ' · 보내는 중' : ''}` }];
  S.inbox.forEach(x => { const p = normPhone(x.from); if (phones.has(p) && (x.at || 0) >= from) out.push({ at: x.at || 0, me: false, p, text: x.body || '', unread: !x.handled, id: x.id }); });
  // 같은 방에서 다시 보낸 것 (모두 / 답장 없는 분만)
  S.bulkAll.filter(o => o.parent === j.id).forEach(o => { const r = o.results || {}; const n = (o.items || []).length; const ok = Object.values(r).filter(v => v === 'OK').length, fl = Object.values(r).filter(v => v !== 'OK').length;
    out.push({ at: o.createdMs || 0, me: true, all: true, label: o.label || '📢 모두에게', text: (o.items[0] || {}).t || '', st: o.status === 'DONE' ? (fl ? 'fail' : 'ok') : 'wait', info: `${n}명에게 · 성공 ${ok}${fl ? ` · 실패 ${fl}` : ''}${o.status !== 'DONE' ? ' · 보내는 중' : ''}` }); });
  S.bulkAll.forEach(o => { if (o.id === j.id || o.parent || (o.createdMs || 0) < from || (o.items || []).length !== 1) return; const it = o.items[0]; const p = normPhone(it.p);
    if (phones.has(p)) { const r = (o.results || {})[0]; out.push({ at: o.createdMs, me: true, p, text: it.t, st: r === 'OK' ? 'ok' : r ? 'fail' : (o.status === 'DONE' ? 'fail' : 'wait'), err: r && r !== 'OK' ? r : '' }); } });
  out.sort((a, b) => a.at - b.at);
  const h = S.chatHidden['g:' + j.id] || 0;
  return { out: out.filter(x => x.at > h), phones };
}

/* ─── 엑셀 ─── */

/* ═════════════ 💰 수련비 · 미납자 관리 ═════════════
   tuition/{YYYY-MM}.rows[studentId] = { paid:'YYYY-MM-DD', method, amount, fee, note, skip }
   config/tuition = { defaultFee, perDay, sickMax, tripMax, bank, tpl, smsLog:{id:day} }
   결석(absences) 중 병결·여행은 평일(수업일) 1일당 5,000원 차감.
   - 그 달 수련비를 아직 안 냈으면 → 그 달 낼 금액에서 바로 빼기
   - 이미 냈으면(차감 없이) → 다음 달 시트에 '이월 차감'으로 적고 다음 달 원비에서 빼기 */
const TU = { month: thisMonth(), docs: {}, cfg: {}, ab: [], abFrom: '', unsub: [], on: false, loaded: false,
  f: 'all', q: '', uf: 'all', withNow: false, sel: new Set(), dirty: false, seen: false };
const TU_DEF = { defaultFee: 160000, fee23: 155000, poomDisc: 5000, sibDisc: 5000, perDay: 5000, sickMax: 10, tripMax: 5, bank: '',
  tpl: '[용인대 정도태권도 2관]\n안녕하세요 {호칭}, {이름} 수련비 안내드려요.\n{내역}\n합계 {금액}원이 아직 확인되지 않았어요.\n{계좌}\n이미 보내주셨다면 말씀 부탁드려요. 감사합니다 :)' };
const METHODS = ['카드', '계좌', '현금', '카드+바우처', '기타'];
const monthAdd = (m, n) => { let [y, mo] = m.split('-').map(Number); mo += n; while (mo > 12){ mo -= 12; y++; } while (mo < 1){ mo += 12; y--; } return `${y}-${pad(mo)}`; };
const won = n => (n == null || n === '' || isNaN(n)) ? '-' : Number(n).toLocaleString('ko-KR');
const mLabel = m => `${+m.slice(5)}월`;
const tuCfg = () => ({ ...TU_DEF, ...TU.cfg });
function absKind(a){
  if (a.kind) return a.kind;
  const r = String(a.reason || '');
  if (/여행|해외|휴가|캠핑|놀러|가족.?여행|체험학습/.test(r)) return 'trip';
  if (/병|아파|아프|아퍼|감기|독감|입원|코로나|장염|수족구|폐렴|다쳐|다침|골절|부상|기침|구토|몸살|수술|치료|발열|열이|열나|컨디션/.test(r)) return 'sick';
  return 'other';
}
const KIND_TXT = { sick: ['병결', 't-bad'], trip: ['여행', 't-in'], other: ['차감 없음', 't-gray'] };
// 11/16, 11/17, 11/18 → "11/16~18" (주말·휴일 건너뛰고 이어지면 한 묶음)
function dayRanges(days){
  days = [...new Set(days)].sort(); const out = []; let st = null, pv = null;
  const nextClass = d => { let x = shiftDay(d, 1); for (let i = 0; i < 7 && isOff(x); i++) x = shiftDay(x, 1); return x; };
  const fmt = (a, b) => { const A = `${+a.slice(5, 7)}/${+a.slice(8)}`; if (a === b) return A; return a.slice(5, 7) === b.slice(5, 7) ? `${A}~${+b.slice(8)}` : `${A}~${+b.slice(5, 7)}/${+b.slice(8)}`; };
  days.forEach(d => { if (st && d === nextClass(pv)) pv = d; else { if (st) out.push(fmt(st, pv)); st = pv = d; } });
  if (st) out.push(fmt(st, pv)); return out.join(', ');
}
function tuMonths(){ const ms = new Set(Object.keys(TU.docs)); ms.add(thisMonth()); ms.add(TU.month); return [...ms].filter(m => /^\d{4}-\d{2}$/.test(m)).sort(); }
function tuRow(m, id){ const d = TU.docs[m]; return (d && d.rows && d.rows[id]) || {}; }
function tuShown(s, m){
  const r = tuRow(m, s.id);
  if (r.paid) return true;
  const D = TU.docs[m]; if (D && D.listed) return !!(D.rows && D.rows[s.id]);   // 엑셀에서 가져온 달은 그 달 명단에 있던 원생만
  if (s.joinedMonth && m < s.joinedMonth) return false;
  if (s.status === 'ACTIVE' || s.status === 'LEAVE') return true;
  return !!(s.leftMonth && m <= s.leftMonth);   // 퇴관한 달까지는 명단에 있음 (미납 · 띠 확인), 다음 달부터 빠짐
}
// 학생×달 계산 (이월 차감을 이어서 계산)
function tuCalc(){
  const cfg = tuCfg(), months = tuMonths(), absBy = new Map();
  TU.ab.forEach(a => { const k = absKind(a); if (k === 'other' || !a.studentId || !a.day) return; const key = a.studentId + '|' + a.day.slice(0, 7); let o = absBy.get(key); if (!o) absBy.set(key, o = { sick: [], trip: [] }); o[k].push(a.day); });
  // 형제가 한 줄에 합쳐서 낸 경우(예: 김동현 335,000원): 나머지 형제도 그 달 납부로 봐요
  const cover = new Map(), feeOf = (s, m) => { const r = tuRow(m, s.id); return (r.fee != null && r.fee !== '') ? +r.fee : (s.fee || cfg.defaultFee); };
  familyGroups(S.students.filter(s => s.status !== 'LEFT')).forEach(g => months.forEach(m => {
    const payer = g.find(s => { const r = tuRow(m, s.id); return r.paid && r.amount != null && r.amount !== '' && +r.amount >= feeOf(s, m) * 1.5; });
    if (payer) g.forEach(s => { if (s !== payer && !tuRow(m, s.id).paid) cover.set(s.id + '|' + m, payer.name); });
  }));
  const out = new Map();
  S.students.forEach(s => {
    let carry = 0, carryNote = '';
    months.forEach(m => {
      const r = tuRow(m, s.id), shown = tuShown(s, m);
      const fee = (r.fee != null && r.fee !== '') ? +r.fee : (s.fee || cfg.defaultFee);
      const o = absBy.get(s.id + '|' + m) || { sick: [], trip: [] };
      const sickN = Math.min(o.sick.length, cfg.sickMax), tripN = Math.min(o.trip.length, cfg.tripMax);
      const ded = Math.max(sickN, tripN) * cfg.perDay;   // 병결·여행이 같은 달에 같이 있으면 더 큰 쪽 하나만 차감
      const coveredBy = cover.get(s.id + '|' + m) || '';
      const paid = !!r.paid || !!coveredBy;

        carryIn ? `지난달 이월 차감 -${won(carryIn)}원 (${carryInNote})` : '',
        ded ? (paid && carryOut ? `${dedNote} → 이미 납부해서 ${mLabel(monthAdd(m, 1))} 원비에서 -${won(carryOut)}원` : `${dedNote}${paid ? '' : ' (낼 금액에 반영)'}`) : '',
      ].filter(Boolean).join(' / ');

}

/* ─── 가져오기: 이름으로 원생 찾기 ─── */
function findKid(name, grade){
  name = String(name || '').replace(/\s+/g, ''); if (!name) return null;
  const c = S.students.filter(s => s.name.replace(/\s+/g, '') === name); if (c.length <= 1) return c[0] || null;
  const g = String(grade || ''); const a = c.filter(s => s.status === 'ACTIVE');
  const byG = c.filter(s => g && (gradeOf(s) === g || s.grade === g || (ageOf(g) && ageKey(s) === ageOf(g))));
  return byG[0] || (a.length === 1 ? a[0] : null);
}
const METHOD_MAP = { '카': '카드', '카드': '카드', '계': '계좌', '계좌': '계좌', '이체': '계좌', '현': '현금', '현금': '현금', '카+바': '카드+바우처', '바': '카드+바우처' };
const normMethod = t => { t = String(t || '').trim(); return METHOD_MAP[t] || t; };
function normPayDate(v, m){
  if (v == null || v === '') return '';
  if (typeof v === 'number' && v > 30000 && v < 60000){ const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  if (v instanceof Date) return dayOf(v.getTime());
  const s = String(v).trim(); let x;
  if ((x = s.match(/(\d{4})[.\-/년\s]+(\d{1,2})[.\-/월\s]+(\d{1,2})/))) return `${x[1]}-${pad(x[2])}-${pad(x[3])}`;
  if ((x = s.match(/^(\d{1,2})[.\-/월\s]+(\d{1,2})/))){ let y = +m.slice(0, 4); if (+x[1] > +m.slice(5) + 1) y--; return `${y}-${pad(x[1])}-${pad(x[2])}`; }
  return /완|납|o|ㅇ|✓|v/i.test(s) ? `${m}-01` : '';
}
async function tuApply(m, recs, label){
  // recs: [{name, grade, paid, method, amount, note, fee}]
  const hit = [], miss = [], rows = {};
  recs.forEach(x => { const s = findKid(x.name, x.grade); if (!s){ if (x.name) miss.push(x.name); return; }
    const cur = tuRow(m, s.id), o = {};
    if (x.paid && !cur.paid) o.paid = x.paid;
    if (x.method && !cur.method) o.method = x.method;
    if (x.amount != null && x.amount !== '' && !isNaN(x.amount) && cur.amount == null) o.amount = +x.amount;
    if (x.fee && cur.fee == null) o.fee = +x.fee;
    if (x.note && !cur.note) o.note = String(x.note);
    o.inSheet = true; rows[s.id] = o; hit.push(s.name);
  });
  if (Object.keys(rows).length) await setDoc(doc(db, 'tuition', m), { rows, ...(label === 'listed' ? { listed: true } : {}) }, { merge: true });
  return { hit, miss };
}
function tuImportXlsx(m){
  const f = document.createElement('input'); f.type = 'file'; f.accept = '.xlsx,.xls,.csv';
  f.onchange = async () => { const file = f.files[0]; if (!file) return;
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: false });
      // 시트마다: 이름 칸 + 납입 칸이 있는 표 찾기, 시트 이름의 "26년 9월" → 2026-09
      const tables = [];
      wb.SheetNames.forEach(n => { const a = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' });
        for (let i = 0; i < Math.min(a.length, 15); i++){ const h = a[i].map(x => String(x).replace(/\s+/g, '')); const ni = h.findIndex(x => /^(관원명|이름|성명|원생명?|수련생)$/.test(x));
          if (ni >= 0 && h.some(x => /납입|납부|입금|금액|결제|카\/?계/.test(x))){ const mm = n.match(/(\d{2,4})\s*년\s*(\d{1,2})\s*월/); const y = mm ? (mm[1].length === 2 ? 2000 + +mm[1] : +mm[1]) : 0;
            tables.push({ sheet: n, month: mm ? `${y}-${pad(+mm[2])}` : '', a, i, h, ni }); break; } } });
      if (!tables.length) return toast('이름·납입일(금액) 칸이 있는 표를 못 찾았어요');
      let use = tables.filter(t => t.month);
      if (!use.length){ const pm = prompt(`어느 달 수련비로 넣을까요? (예: ${m})`, m); if (!pm || !/^\d{4}-\d{2}$/.test(pm)) return; use = [{ ...tables[0], month: pm }]; }
      else { use.sort((x, y) => x.month.localeCompare(y.month));
        const from = prompt(`이 엑셀에서 ${use.length}개 달(${use[0].month} ~ ${use[use.length - 1].month})을 찾았어요.\n몇 월부터 가져올까요? (예: 2026-01)\n· 그 달부터 엑셀 명단에 있는 원생만 그 달 수련비 대상이 돼요\n· 이미 적힌 칸은 덮어쓰지 않아요`, use.length > 3 ? use[use.length - 3].month : use[0].month);
        if (!from || !/^\d{4}-\d{2}$/.test(from)) return; use = use.filter(t => t.month >= from); if (!use.length) return toast('그 달부터는 시트가 없어요'); }
      const cfg = tuCfg(), fams = familyGroups(S.students.filter(s => s.status !== 'LEFT')), inFam = id => fams.some(g => g.some(s => s.id === id));
      const out = [];
      for (const t of use){
        const { a, i, h, ni } = t; const col = re => h.findIndex(x => re.test(x));
        const ci = { grade: col(/학년|반|부$/), days: col(/수업일수|주\d|횟수|수강/), paid: col(/납입일|납부일|입금일|결제일|날짜/), method: col(/카\/?계|결제|방법|구분|수단/), amount: col(/납입비|납입액|납부액|입금액|^금액|수납/), fee: col(/원비|^수련비|교육비|청구/), note: col(/비고|메모/) };
        const recs = a.slice(i + 1).filter(r => String(r[ni]).trim() && !/^(합계|총|계)$/.test(String(r[ni]).trim())).map(r => {
          const name = String(r[ni]).trim(), amount = ci.amount >= 0 && r[ci.amount] !== '' ? +String(r[ci.amount]).replace(/[^\d.]/g, '') || null : null;
          let fee = ci.fee >= 0 && ci.fee !== ci.amount ? +String(r[ci.fee]).replace(/[^\d.]/g, '') || null : null;
          if (!fee && ci.days >= 0){ const d = String(r[ci.days]); const k = findKid(name, ci.grade >= 0 ? r[ci.grade] : '');
            if (/[45]/.test(d) || /[23]/.test(d)){ fee = /[45]/.test(d) ? cfg.defaultFee : cfg.fee23;
              if (k && /품/.test(k.belt || '')) fee -= cfg.poomDisc;      // 품띠 띠값 5,000원 빼기
              if (k && inFam(k.id)) fee -= cfg.sibDisc; } }               // 형제 5,000원 빼기
          return { name, grade: ci.grade >= 0 ? r[ci.grade] : '', paid: ci.paid >= 0 ? normPayDate(r[ci.paid], t.month) : '', method: ci.method >= 0 && ci.method !== ci.paid ? normMethod(r[ci.method]) : '', amount, fee, note: ci.note >= 0 ? r[ci.note] : '' }; });
        const { hit, miss } = await tuApply(t.month, recs, 'listed'); out.push({ t, hit, miss });
      }
      TU.month = use[use.length - 1].month; render();
      const miss = [...new Set(out.flatMap(o => o.miss))];
      alert(`가져오기 끝\n${out.map(o => `· ${o.t.month}: ${o.hit.length}명`).join('\n')}\n· 이미 적혀 있던 칸은 그대로 뒀어요${miss.length ? `\n· 출결 명단에서 못 찾은 이름 ${miss.length}명: ${miss.slice(0, 40).join(', ')}` : ''}`);
    } catch(e){ console.error(e); toast('엑셀을 못 읽었어요'); }
  };
  f.click();
}

      src = '수련비 앱에 들어 있던 원래 엑셀 자료';
    } catch(e){ return toast('예전 수련비 자료를 못 찾았어요'); }
  }
  if (!stu || !stu.length) return toast('예전 수련비 자료가 없어요');
  const ms = Object.keys(months).sort();
  if (!confirm(`${src}를 가져올까요?\n원생 ${stu.length}명 · ${ms.map(mLabel).join(', ') || '달 기록 없음'}\n(이미 적혀 있는 칸은 덮어쓰지 않아요)`)) return;
  const fee = s => { let b = s.baseFee; if (b == null) return null; const g = s.sibGroup && groups[s.sibGroup]; if (g) b = g.discountType === 'percent' ? b - Math.round(b * (g.discountValue || 0) / 100) : b - (g.discountValue || 0); return Math.max(0, b); };
  let hitAll = new Set(), missAll = new Set();
  for (const m of ms){
    const recs = stu.map(s => { const r = months[m][s.id] || {}; return { name: s.name, grade: s.grade, paid: r.paydate || '', method: normMethod(r.method), amount: r.amount, fee: fee(s), note: r.note || '' }; });
    const { hit, miss } = await tuApply(m, recs); hit.forEach(x => hitAll.add(x)); miss.forEach(x => missAll.add(x));
  }
  // 원비가 비어 있는 원생은 예전 기본 원비로
  const b = writeBatch(db); let nf = 0;
  stu.forEach(s => { const k = findKid(s.name, s.grade), f = fee(s); if (k && !k.fee && f){ b.set(doc(db, 'students', k.id), { fee: f }, { merge: true }); nf++; } });
  if (nf) await b.commit();
  if (ms.length) TU.month = ms[ms.length - 1];
  render();
  alert(`가져오기 끝\n· ${ms.map(mLabel).join(', ')} 자료 · ${hitAll.size}명${nf ? `\n· 원비 채움 ${nf}명` : ''}${missAll.size ? `\n· 출결 명단에서 못 찾은 이름: ${[...missAll].join(', ')}` : ''}`);
}


/* ═════════════ 📺 인성교육 영상 (해마다 1~12월 × 1~4주차, 5주차는 있을 때만) ═════════════
   edu/{year} = { "m1w1": { title, url, kind:'youtube'|'drive'|'file'|'link', path, at } } */
const ED = { year: thisYear(), docs: {}, unsub: null, sub: '' };
const edKey = (m, w) => `m${m}w${w}`;
function edWeekNow(){ const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() + 1, w: Math.min(5, Math.ceil(d.getDate() / 7)) }; }
function edParse(url){
  url = String(url || '').trim(); let x;
  if ((x = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/))) return { kind: 'youtube', id: x[1], embed: `https://www.youtube.com/embed/${x[1]}?rel=0`, thumb: `https://img.youtube.com/vi/${x[1]}/hqdefault.jpg` };
  if ((x = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{20,})/))) return { kind: 'drive', embed: `https://drive.google.com/file/d/${x[1]}/preview`, thumb: '' };
  if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url) || /firebasestorage\.googleapis\.com/.test(url)) return { kind: 'file', src: url, thumb: '' };
  if (/^https?:\/\//.test(url)) return { kind: 'link', src: url, thumb: '' };
  return null;
}
function edSubscribe(){

}

    ${!data ? '<p class="muted">불러오는 중…</p>' : `<div class="edyear">${Array.from({ length: 12 }, (_, i) => i + 1).map(m => {
      const has5 = !!data[edKey(m, 5)];

function edPlay(m, w){

    <div style="margin-bottom:10px"><div class="muted">제목</div><input type="text" id="edT" value="${esc(v.title || '')}" placeholder="예: 친구에게 먼저 인사해요" style="width:100%"></div>

async function edStorageDelete(path){ try { const st = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js'); await st.deleteObject(st.ref(st.getStorage(fb), path)); } catch(e){} }


/* ═════════════ 👪 수련생 현황 (학년별 · 형제 · 보호자 연락처) ═════════════ */

function familyGroups(list){
  const par = new Map(list.map(s => [s.id, s.id])); const f = x => { while (par.get(x) !== x){ par.set(x, par.get(par.get(x))); x = par.get(x); } return x; };
  const join = (a, b) => { a = f(a); b = f(b); if (a !== b) par.set(a, b); };
  const byKey = new Map();
  list.forEach(s => { const ks = s.phones.map(normPhone).filter(n => n.length >= 9).map(n => 'p' + n); if (s.siblingKey) ks.push('k' + s.siblingKey);
    ks.forEach(k => { if (byKey.has(k)) join(s.id, byKey.get(k)); else byKey.set(k, s.id); }); });
  const fam = new Map(); list.forEach(s => { const r = f(s.id); if (!fam.has(r)) fam.set(r, []); fam.get(r).push(s); });
  return [...fam.values()].filter(g => g.length > 1).map(g => g.sort((a, b) => ageKey(b) - ageKey(a) || a.name.localeCompare(b.name, 'ko'))).sort((a, b) => a[0].name.localeCompare(b[0].name, 'ko'));
}

/* ═════════════ 🚐 차량 · 🚶 도보 픽업 (똑타버스처럼 노선도 + 실시간 위치 + 정류장 도착 자동 기록) ═════════════
   routes/{id} = { name, type:'car'|'walk', dir:'in'|'out', car, days:[1..6], radius, stops:[{ id, name, time, lat, lng, on:[studentId], off:[studentId] }] }
   runs/{day}_{routeId} = { day, routeId, name, status:'live'|'done', startedAt, endedAt, live:{lat,lng,acc,at}, track:[{t,lat,lng}], arrivals:{stopId:ms}, departs:{stopId:ms} }
   config/bus = { home:{lat,lng}, radius, naverId } */
const BUS = { on: false, routes: [], runs: {}, abs: new Set(), cfg: {}, view: 'live', sel: '', edit: null, map: null, placing: -1, drive: null, mapsReady: null };
const BUS_HOME = { lat: 37.0043, lng: 127.2630 };   // 도장 위치 기본값 (설정에서 바꿔요)
const busHome = () => (BUS.cfg.home && BUS.cfg.home.lat) ? BUS.cfg.home : BUS_HOME;
const busRadius = r => +(r && r.radius) || +BUS.cfg.radius || 80;
const DAYS_KO = ['일', '월', '화', '수', '목', '금', '토'];
const busId = () => Math.random().toString(36).slice(2, 9);
const hmNow = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hmOf = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const minOf = hm => { const m = String(hm || '').match(/^(\d{1,2}):(\d{2})$/); return m ? +m[1] * 60 + +m[2] : 9999; };
function geoDist(a, b){ if (!a || !b || a.lat == null || b.lat == null) return Infinity; const R = 6371000, t = x => x * Math.PI / 180;
  const dLa = t(b.lat - a.lat), dLo = t(b.lng - a.lng), h = Math.sin(dLa / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
const busDow = () => new Date().getDay();
const stTime = (s, d) => (s && s.times && s.times[d == null ? busDow() : d]) || (s && s.time) || '';
const busStart0 = (r, d) => (r.stops && r.stops[0] && stTime(r.stops[0], d)) || '';
// 오늘 이 노선에 실제로 타는 아이: 재원생만(휴원·퇴관 빼기) + 아이별 탑승 요일
const busKids = (r, ids, d) => (ids || []).filter(id => { const s = S.students.find(x => x.id === id); if (!s || s.status !== 'ACTIVE') return false; const kd = r.kidDays && r.kidDays[id]; return !kd || !kd.length || kd.includes(d == null ? busDow() : d); });
const busSort = (a, b) => minOf(busStart0(a)) - minOf(busStart0(b)) || String(a.name).localeCompare(String(b.name), 'ko');
const busToday = () => { const w = new Date().getDay(); return BUS.routes.filter(r => !r.days || !r.days.length || r.days.includes(w)); };
const kidName = id => { const s = S.students.find(x => x.id === id); return s ? s.name : '(지운 원생)'; };
// 부모님 링크용 공개 사본 (아이 이름·번호는 안 올라가요: 정류장 이름·시간·차 위치만)
const PUB_BUS = 'https://taekwondo-wordgame-default-rtdb.asia-southeast1.firebasedatabase.app/apps/pub_bus/data/';
const PUB_PAGE = 'https://yujongho0714.github.io/check/bus.html';
const pubNewKey = () => Array.from(crypto.getRandomValues(new Uint8Array(15)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
const pubRoute = r => ({ name: r.name || '', type: r.type || 'car', dir: r.dir || 'in', car: (r.car || '').split(' ')[0], stops: (r.stops || []).map(x => ({ name: x.name || '', time: stTime(x), lat: x.lat ?? null, lng: x.lng ?? null })), naverId: BUS.cfg.naverId || '', dojo: DOJANG_SHORT, at: Date.now() });
async function pubSend(key, path, data, method){ if (!key) return; try { await fetch(`${PUB_BUS}r_${key}/${path}.json`, { method: method || 'PUT', body: JSON.stringify(data) }); } catch(e){} }
async function pubEnsure(r){ if (r.pubKey) return r.pubKey; const k = pubNewKey(); r.pubKey = k; await setDoc(doc(db, 'routes', r.id), { pubKey: k }, { merge: true }); await pubSend(k, 'route', pubRoute(r)); return k; }
const pubLink = (r, stopIdx) => `${PUB_PAGE}?k=${r.pubKey}${stopIdx != null && stopIdx >= 0 ? '&s=' + stopIdx : ''}`;

/* ── 지도: 네이버 지도 키가 있으면 네이버, 없으면 오픈스트리트맵(임시) ── */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function loadCss(href){ if (document.querySelector(`link[href="${href}"]`)) return; const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l); }
function mapsLoad(){
  const id = (BUS.cfg.naverId || '').trim();
  if (BUS.mapsReady && BUS.mapsReady.id === id) return BUS.mapsReady.p;
  const p = (async () => {
    if (id && !window.__naverFail){
      try {
        window.navermap_authFailure = () => { window.__naverFail = true; toast('네이버 지도 키 인증이 안 돼요 — 임시 지도로 보여요 (키·사이트 주소 등록 확인)'); BUS.mapsReady = null; if (S.tab === 'bus') render(); };
        if (!window.naver || !window.naver.maps) await loadScript(`https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(id)}`);
        if (window.naver && window.naver.maps) return 'naver';
      } catch(e){}
    }
    loadCss('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css');
    if (!window.L) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js');
    return 'leaflet';
  })();
  BUS.mapsReady = { id, p }; return p;
}
const pinHtml = (label, color, big) => `<div style="width:${big ? 34 : 26}px;height:${big ? 34 : 26}px;border-radius:50%;background:${color};color:#fff;font:800 ${big ? 16 : 12.5}px 'Noto Sans KR',sans-serif;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)">${label}</div>`;
async function mapMake(el){
  const kind = await mapsLoad(), h = busHome();
  if (!el.isConnected) return null;
  const M = { kind, marks: [], car: null, line: null, track: null };
  if (kind === 'naver'){
    const N = naver.maps, ll = (a, b) => new N.LatLng(a, b);
    M.map = new N.Map(el, { center: ll(h.lat, h.lng), zoom: 15 });
    const pin = (p, html, drag) => new N.Marker({ position: ll(p.lat, p.lng), map: M.map, draggable: !!drag, icon: { content: html, anchor: new N.Point(15, 15) } });
    M.setStops = (stops, onDrag) => { M.marks.forEach(m => m.setMap(null)); M.marks = []; if (M.line) M.line.setMap(null);
      const pts = stops.filter(s => s.lat != null); stops.forEach((s, i) => { if (s.lat == null) return; const m = pin(s, pinHtml(i + 1, s.color || '#1e3a8a'), !!onDrag); if (onDrag) N.Event.addListener(m, 'dragend', e => onDrag(i, e.coord.lat(), e.coord.lng())); M.marks.push(m); });
      if (pts.length > 1) M.line = new N.Polyline({ map: M.map, path: pts.map(s => ll(s.lat, s.lng)), strokeColor: '#1e3a8a', strokeWeight: 4, strokeOpacity: .55, strokeStyle: 'shortdash' }); };
    M.setCar = (p, icon) => { if (!p){ if (M.car) M.car.setMap(null); M.car = null; return; } if (!M.car) M.car = pin(p, pinHtml(icon || '🚐', '#16a34a', true)); else M.car.setPosition(ll(p.lat, p.lng)); };
    M.setTrack = pts => { if (M.track) M.track.setMap(null); M.track = pts && pts.length > 1 ? new N.Polyline({ map: M.map, path: pts.map(p => ll(p.lat, p.lng)), strokeColor: '#16a34a', strokeWeight: 5, strokeOpacity: .8 }) : null; };
    M.fit = pts => { pts = pts.filter(p => p && p.lat != null); if (!pts.length) return; if (pts.length === 1){ M.map.setCenter(ll(pts[0].lat, pts[0].lng)); return; }
      const b = new N.LatLngBounds(ll(pts[0].lat, pts[0].lng), ll(pts[0].lat, pts[0].lng)); pts.forEach(p => b.extend(ll(p.lat, p.lng))); M.map.fitBounds(b, { top: 40, right: 40, bottom: 40, left: 40 }); };

    M.setStops = (stops, onDrag) => { M.marks.forEach(m => m.remove()); M.marks = []; if (M.line) M.line.remove();
      const pts = stops.filter(s => s.lat != null); stops.forEach((s, i) => { if (s.lat == null) return; const m = L.marker([s.lat, s.lng], { icon: icon(pinHtml(i + 1, s.color || '#1e3a8a')), draggable: !!onDrag }).addTo(M.map).bindTooltip(`${i + 1}. ${s.name || ''} ${s.time || ''}`); if (onDrag) m.on('dragend', () => { const q = m.getLatLng(); onDrag(i, q.lat, q.lng); }); M.marks.push(m); });
      M.line = pts.length > 1 ? L.polyline(pts.map(s => [s.lat, s.lng]), { color: '#1e3a8a', weight: 4, opacity: .5, dashArray: '8 8' }).addTo(M.map) : null; };
    M.setCar = (p, ic) => { if (!p){ if (M.car) M.car.remove(); M.car = null; return; } if (!M.car) M.car = L.marker([p.lat, p.lng], { icon: L.divIcon({ html: pinHtml(ic || '🚐', '#16a34a', true), className: '', iconSize: [38, 38], iconAnchor: [19, 19] }), zIndexOffset: 1000 }).addTo(M.map); else M.car.setLatLng([p.lat, p.lng]); };
    M.setTrack = pts => { if (M.track) M.track.remove(); M.track = pts && pts.length > 1 ? L.polyline(pts.map(p => [p.lat, p.lng]), { color: '#16a34a', weight: 5, opacity: .8 }).addTo(M.map) : null; };
    M.fit = pts => { pts = pts.filter(p => p && p.lat != null); if (!pts.length) return; if (pts.length === 1) M.map.setView([pts[0].lat, pts[0].lng], 16); else M.map.fitBounds(pts.map(p => [p.lat, p.lng]), { padding: [40, 40] }); };
    M.onClick = cb => M.map.on('click', e => cb(e.latlng.lat, e.latlng.lng));

/* ── 정류장 진행 상황 (어디까지 왔나) ── */
function busProgress(r, run){
  const st = r.stops || [], arr = (run && run.arrivals) || {}, dep = (run && run.departs) || {};
  let last = -1; st.forEach((s, i) => { if (arr[s.id]) last = i; });
  const next = run && run.status === 'live' ? Math.min(last + 1, st.length - 1) : -1;
  const live = run && run.live, fresh = live && Date.now() - live.at < 90000;
  let distNext = null; if (live && next >= 0 && st[next] && st[next].lat != null) distNext = geoDist(live, st[next]);
  return { arr, dep, last, next: last + 1 < st.length ? next : -1, live, fresh, distNext };
}
function kidChip(id, r, extra){
  const s = S.students.find(x => x.id === id); const absent = BUS.abs.has(id);
  const ins = S.todayEv.some(e => e.studentId === id && e.type === 'IN'), outs = S.todayEv.some(e => e.studentId === id && e.type === 'OUT');
  const tag = absent ? '<i class="kb">결석</i>' : r.dir === 'out' ? (outs ? '<i class="kg">하원함</i>' : ins ? '' : '<i class="kw">등원 안 함</i>') : (ins ? '<i class="kg">등원함</i>' : '');
  return `<span class="bkid ${absent ? 'abs' : ''}">${esc(s ? s.name : '(지운 원생)')}${s && extra ? ` <small>${esc(gradeOf(s))}</small>` : ''}${tag}</span>`;
}
function busTimelineHtml(r, run, forDriver){
  const st = r.stops || [], P = busProgress(r, run);
  if (!st.length) return '<p class="muted">정류장이 없어요. [노선 관리]에서 정류장을 넣어 주세요.</p>';
  return `<div class="btl">${st.map((s, i) => {
    const a = P.arr[s.id], done = !!a, isNext = i === P.next;
    const tm = stTime(s), on = busKids(r, s.on), off = busKids(r, s.off);
    const late = a && tm ? Math.round((minOf(hmOf(a)) - minOf(tm))) : null;
    const carHere = run && run.status === 'live' && i === P.last + 1 && P.last >= 0;
    return `${carHere ? `<div class="bcar"><span>${r.type === 'walk' ? '🚶' : '🚐'}</span><b>${P.fresh ? '지금 이동 중' : '위치 신호 끊김'}</b>${P.distNext != null && isFinite(P.distNext) ? ` · 다음 정류장까지 ${P.distNext < 1000 ? Math.round(P.distNext) + 'm' : (P.distNext / 1000).toFixed(1) + 'km'} (약 ${Math.max(1, Math.round(P.distNext / (r.type === 'walk' ? 70 : 350)))}분)` : ''}</div>` : ''}
    <div class="bst ${done ? 'done' : ''} ${isNext ? 'next' : ''}">
      <div class="bdot">${done ? '✓' : i + 1}</div>
      <div class="bbody">
        <div class="bhead"><b class="btime">${esc(tm || '--:--')}</b><b class="bname">${esc(s.name || '정류장')}</b>${s.lat == null ? '<span class="tag t-wait">위치 없음</span>' : ''}
          ${a ? `<span class="tag ${late > 3 ? 't-wait' : 't-ok'}">${hmOf(a)} 도착${late != null ? (late > 0 ? ` +${late}분` : late < 0 ? ` ${late}분` : ' 정시') : ''}</span>` : isNext ? '<span class="tag t-in">다음 정류장</span>' : ''}
          ${P.dep[s.id] ? `<span class="muted">${hmOf(P.dep[s.id])} 출발</span>` : ''}</div>
        ${on.length ? `<div class="bkids"><span class="blab on">타요 ${on.filter(id => !BUS.abs.has(id)).length}</span>${on.map(id => kidChip(id, r, forDriver)).join('')}</div>` : ''}
        ${off.length ? `<div class="bkids"><span class="blab off">내려요 ${off.filter(id => !BUS.abs.has(id)).length}</span>${off.map(id => kidChip(id, r, forDriver)).join('')}</div>` : ''}
        ${forDriver && isNext && run && run.status === 'live' ? `<button class="btn" data-arrive="${s.id}" style="margin-top:8px;background:#16a34a">✓ ${esc(s.name || '정류장')} 도착</button>` : ''}
      </div></div>`; }).join('')}</div>`;

  // 도착: 아직 안 찍힌 정류장 중 (마지막 도착 다음 2곳까지) 반경 안에 들어오면 시간 찍기
  let lastI = -1; st.forEach((s, i) => { if (arr[s.id]) lastI = i; });
  for (let i = lastI + 1; i < Math.min(st.length, lastI + 3); i++){ const s = st[i]; if (s.lat != null && !arr[s.id] && geoDist(pos, s) <= rad + Math.min(60, D.acc || 0) / 2){ driveArrive(r, s.id, false); break; } }
  // 출발: 마지막으로 도착한 정류장에서 반경 밖으로 나가면 출발 시간
  if (lastI >= 0){ const s = st[lastI]; if (!dep[s.id] && geoDist(pos, s) > rad * 1.5) setDoc(runRef(r), { departs: { [s.id]: now } }, { merge: true }); }
  // 위치 보내기: 10초마다(멈춰 있으면 30초마다)
  const moved = D.sentPos ? geoDist(D.sentPos, pos) : Infinity;
  if (now - D.sentAt >= 10000 && (moved >= 15 || now - D.sentAt >= 30000)){
    D.sentAt = now; D.sentPos = pos;
    setDoc(runRef(r), { live: { ...pos, acc: Math.round(D.acc || 0), at: now }, track: arrayUnion({ t: now, lat: +pos.lat.toFixed(6), lng: +pos.lng.toFixed(6) }) }, { merge: true }).catch(e => { D.err = '전송 실패'; });
    pubSend(r.pubKey, 'run/live', { lat: +pos.lat.toFixed(5), lng: +pos.lng.toFixed(5), at: now });
  }
  driveDraw();
}

/* ═════════════ 🌱 라이프 스킬 · 정도 인성 미션 (월별 주차 미션 · 미션지 인쇄 · 완료 체크 · 승급심사 점수) ═════════════

const LF = { month: thisMonth(), docs: {}, sub: '', unsub: null, q: '', g: '' };

const lfWeeks = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate() > 28 ? 5 : 4; };
const lfWeekNow = () => Math.min(5, Math.ceil(new Date().getDate() / 7));

  p.innerHTML = `

        <div class="row" style="margin:8px 0"><span class="muted">미션 1개 점수</span><input type="number" id="lfPts" value="${pts}" style="width:70px"><span class="muted">점 · 승급심사 총점에 반영</span>

        ${mis.map((x, i) => `<div class="lfm ${i + 1 === nowW ? 'now' : ''}"><div class="lfw">${i + 1}주차${i + 1 === nowW ? '<br><b>이번 주</b>' : ''}</div><div class="grow">
          <input type="text" class="lfT" data-i="${i}" value="${esc(x.title)}" placeholder="미션 (예: 부모님께 감사 편지 쓰기)" style="width:100%">

          ${kids.map(s => `<tr data-id="${s.id}"><td><b>${esc(s.name)}</b></td><td class="muted">${esc(gradeOf(s))}</td>${mis.map((_, i) => `<td style="text-align:center"><button class="lfc ${(done[s.id] || [])[i] ? 'on' : ''}" data-w="${i}">${(done[s.id] || [])[i] ? '✓' : ''}</button></td>`).join('')}<td><b>${cnt(s)}</b>/${W}</td><td><b style="color:var(--blue)">${cnt(s) * pts}</b>점</td></tr>`).join('') || `<tr><td colspan="${W + 4}" class="muted">원생이 없어요</td></tr>`}
        </table></div>
      </div>
    </div>`;
  $('#lfPrev').onclick = () => { LF.month = monthAdd(m, -1); render(); }; $('#lfNext').onclick = () => { LF.month = monthAdd(m, 1); render(); };
  const save = patch => setDoc(doc(db, 'life', m), patch, { merge: true });
  const readMis = () => Array.from({ length: W }, (_, i) => ({ title: (p.querySelector(`.lfT[data-i="${i}"]`) || {}).value || '', desc: (p.querySelector(`.lfD[data-i="${i}"]`) || {}).value || '' }));
  p.querySelectorAll('.lfT, .lfD').forEach(el => el.addEventListener('change', () => save({ missions: readMis() })));
  $('#lfTheme').addEventListener('change', e => save({ theme: e.target.value.trim() }));
  $('#lfPts').addEventListener('change', e => save({ points: Math.max(0, +e.target.value || 0) }));
  if ($('#lfAdd5')) $('#lfAdd5').onclick = () => save({ missions: [...readMis(), { title: '', desc: '' }] });
  p.querySelectorAll('.lfc').forEach(b => b.onclick = () => { const id = b.closest('tr').dataset.id, i = +b.dataset.w; const arr = Array.from({ length: W }, (_, k) => (done[id] || [])[k] ? 1 : 0); arr[i] = arr[i] ? 0 : 1; save({ done: { [id]: arr } }); });
  p.querySelectorAll('[data-allw]').forEach(b => b.onclick = () => { const i = +b.dataset.allw; if (!confirm(`지금 보이는 ${kids.length}명 모두 ${i + 1}주차 완료로 할까요?`)) return; const d = {}; kids.forEach(s => { const arr = Array.from({ length: W }, (_, k) => (done[s.id] || [])[k] ? 1 : 0); arr[i] = 1; d[s.id] = arr; }); save({ done: d }); });
  $('#lfG').onchange = e => { LF.g = e.target.value; render(); };
  const qi = $('#lfQ'); const qf = () => { LF.q = qi.value; render(); setTimeout(() => { const n = $('#lfQ'); if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }); };
  qi.addEventListener('input', e => { if (!e.isComposing) qf(); }); qi.addEventListener('compositionend', qf);
  $('#lfPr1').onclick = () => lfPrint(m, { ...D, missions: readMis() }, [null]);
  $('#lfPrN').onclick = () => lfPrint(m, { ...D, missions: readMis() }, active().sort(byName));
  $('#lfX').onclick = () => exportXlsx([['이름', '학년', ...mis.map((_, i) => `${i + 1}주차`), '완료', '점수'], ...active().sort(byName).map(s => [s.name, gradeOf(s), ...mis.map((_, i) => (done[s.id] || [])[i] ? 'O' : ''), cnt(s), cnt(s) * pts])], `life_skill_${m}.xlsx`, `${+m.slice(5)}월 라이프스킬`);
  $('#lfSms').onclick = () => lfSms(m, readMis(), D.theme || '', nowW || 1);
}
function lfPrint(m, D, kids){
  const W = Math.max(4, (D.missions || []).length), mis = Array.from({ length: W }, (_, i) => (D.missions || [])[i] || { title: '', desc: '' });
  const page = s => `<section class="pg"><div class="hd"><div><div class="dj">${esc(DOJANG_SHORT)}</div><div class="tt">라이프 스킬 · 정도 인성 미션</div></div><div class="mo"><b>${+m.slice(5)}월</b><span>${m.slice(0, 4)}</span></div></div>
    ${D.theme ? `<div class="th">이달의 주제 <b>${esc(D.theme)}</b></div>` : ''}

    <div class="ft">✔ 미션을 실천하고 체크·서명해서 도장에 가져오면, <b>정기 승급심사 총점</b>에 반영돼요 (미션 1개 ${D.points ?? 5}점)</div></section>`;
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(f);
  const d = f.contentDocument; d.open(); d.write(`<!doctype html><html><head><meta charset="utf-8"><title>라이프 스킬 ${m}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

    .th{margin:12px 0 0;padding:10px 14px;border:2px solid #f5c518;border-radius:12px;font-size:15px}.th b{font-size:19px;margin-left:6px}
    .nm{margin:12px 0;font-size:16px}.nm span{display:inline-block;min-width:160px;border-bottom:2px solid #111;font-weight:900;font-size:19px;padding:0 6px}.nm em{font-style:normal;color:#6b7280;margin-left:6px}
    table{width:100%;border-collapse:collapse;font-size:14px}th{background:#eef2ff;color:#1e3a8a;font-weight:900;padding:8px;border:1.5px solid #1e3a8a}td{border:1.5px solid #1e3a8a;padding:10px 8px;vertical-align:middle;height:22mm}

function lfSms(m, mis, theme, w){
  const x = mis[w - 1] || {}; if (!x.title) return toast(`${w}주차 미션을 먼저 적어 주세요`);

  const r = modal(`<h2>✉️ ${w}주차 라이프 스킬 미션 문자</h2><p class="muted" style="margin-top:0">재원생 ${kids.length}명 보호자님께 (형제는 한 통으로). {호칭} {이름}을 넣을 수 있어요.</p>

    <textarea id="lsT" style="min-height:150px">${esc(tpl0)}</textarea><div class="row" style="margin-top:10px"><span class="muted" id="lsN"></span><div class="grow"></div><button class="btn ghost" id="lsC">취소</button><button class="btn" id="lsG">보내기</button></div>`);
  r.querySelectorAll('[data-lw]').forEach(b => b.onclick = () => { closeModal(); lfSms(m, mis, theme, +b.dataset.lw); });
  const { list, noPhone } = buildItems(r.querySelector('#lsT').value, kids, false); r.querySelector('#lsN').textContent = `${list.length}통${noPhone.length ? ` · 번호 없음 ${noPhone.length}명` : ''}`;
  r.querySelector('#lsC').onclick = closeModal;
  r.querySelector('#lsG').onclick = async () => { const { list } = buildItems(r.querySelector('#lsT').value, kids, false); if (!list.length) return toast('보낼 번호가 없어요'); if (!confirm(`${list.length}통을 보낼까요?`)) return;
    const now = Date.now(); await addDoc(collection(db, 'bulk'), { title: `🌱 ${+m.slice(5)}월 ${w}주차 라이프 스킬 ${list.length}통`, createdMs: now, lastMs: now, status: 'PENDING', items: list, results: {} });
    closeModal(); toast(`${list.length}통 보내기 시작 (문자 폰)`); };
}

function exportXlsx(rows, file, sheet){
  if (!window.XLSX){ toast('엑셀 도구를 못 불러왔어요'); return; }
  const ws = XLSX.utils.aoa_to_sheet(rows); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheet.slice(0, 31)); XLSX.writeFile(wb, file);
}
