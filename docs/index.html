<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정도 출결 PC 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
  --navy:#1e3a8a; --blue:#2563eb; --in:#2563eb; --out:#ea580c; --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
  --chip:#eef2ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:900;letter-spacing:-.3px}
.dev{display:flex;gap:10px;font-size:13px;flex-wrap:wrap}
.dev span{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#9ca3af;vertical-align:1px}
.dot.on{background:#4ade80}.dot.off{background:#f87171}
header .sp{flex:1}
header .who{font-size:13px;opacity:.85}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 12px}
nav{display:flex;gap:4px;padding:10px 18px 0;flex-wrap:wrap;background:var(--bg)}
nav button{border:0;background:transparent;padding:10px 16px;border-radius:10px 10px 0 0;font-weight:700;color:var(--sub)}
nav button.on{background:var(--card);color:var(--navy);box-shadow:0 -1px 0 var(--line) inset}
main{padding:0 18px 40px}
.panel{background:var(--card);border-radius:0 12px 12px 12px;padding:18px;min-height:60vh}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:9px 16px;font-weight:700}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=month],select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:110px;resize:vertical}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:14px;color:var(--ink)}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.muted{color:var(--sub);font-size:13px}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 8px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--sub);font-weight:700;background:#fafbfc;position:sticky;top:0}
tr.click:hover{background:#f8fafc;cursor:pointer}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:2px 7px;font-weight:700}
.t-in{background:#dbeafe;color:var(--in)}.t-out{background:#ffedd5;color:var(--out)}
.t-ok{background:#dcfce7;color:var(--ok)}.t-bad{background:#fee2e2;color:var(--bad)}.t-wait{background:#fef3c7;color:var(--warn)}
.t-gray{background:#f3f4f6;color:#4b5563}
.belt{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px;white-space:nowrap}
.belt i{display:inline-block;width:22px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px}
.stat{font-size:28px;font-weight:900}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.month td,.month th{padding:4px 5px;text-align:center;font-size:12.5px;border:1px solid #eef0f3}
.month td.nm{text-align:left;white-space:nowrap;font-weight:700;position:sticky;left:0;background:#fff;z-index:1}
.month th.nm{position:sticky;left:0;z-index:2}
.month .we{background:#fdf2f2}.month .sat{background:#eff6ff}
.month .o{color:var(--ok);font-weight:900}.month .a{color:var(--warn);font-weight:700}.month .lv{color:#9ca3af}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal .box{background:#fff;border-radius:14px;padding:20px;width:min(640px,100%)}
.form{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
.form label{font-size:14px;color:var(--sub);font-weight:700}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:10px;z-index:99;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#login{max-width:460px;margin:60px auto;background:#fff;border-radius:16px;padding:26px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
#login h1{margin:0 0 6px;font-size:22px}
#login input{width:100%;margin:6px 0}
.preview{white-space:pre-wrap;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}.bar i{display:block;height:8px;background:var(--ok)}
.kids{display:flex;flex-wrap:wrap;gap:6px;max-height:280px;overflow:auto;padding:4px}
.kid{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13.5px;background:#fff}
.kid.on{background:#dbeafe;border-color:#93c5fd}

/* 카톡 느낌 문자 */
.chat{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 175px);min-height:480px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.clist{border-right:1px solid var(--line);display:flex;flex-direction:column;background:#fff;min-height:0}
.chead{display:flex;align-items:center;padding:12px}
.clistBody{overflow:auto;flex:1}
.citem{display:flex;gap:10px;padding:10px 12px;cursor:pointer;align-items:center}
.citem:hover{background:#f5f5f5}.citem.on{background:#eef2f7}
.cav{width:44px;height:44px;border-radius:16px;background:#9bbbd4;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex:none}
.cav.sm{width:38px;height:38px;border-radius:14px;font-size:15px}
.cmid{flex:1;min-width:0}.cname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.cprev{color:#6b7280;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cbadge{background:#f43f5e;color:#fff;border-radius:99px;font-size:11.5px;font-weight:800;padding:1px 7px;line-height:17px}
.croom{display:flex;flex-direction:column;background:#b2c7da;min-height:0}
.croomHead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(178,199,218,.95);border-bottom:1px solid rgba(0,0,0,.06)}
.cbody{flex:1;overflow:auto;padding:14px 16px}
.cday{text-align:center;margin:14px 0}.cday span{background:rgba(0,0,0,.18);color:#fff;font-size:12px;padding:4px 12px;border-radius:99px}
.cmsg{display:flex;gap:8px;margin:6px 0;align-items:flex-start}
.cmsg.me{justify-content:flex-end;align-items:flex-end}
.cwho{font-size:12.5px;color:#374151;margin-bottom:3px}
.cb{background:#fff;border-radius:4px 14px 14px 14px;padding:8px 11px;max-width:460px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.cb.me{background:#fee500;border-radius:14px 4px 14px 14px}
.cb.att{background:#fff7b3}
.ctag{font-size:11px;color:#6b7280;margin-bottom:3px;font-weight:700}
.cmeta{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:#4b5563;gap:1px;white-space:nowrap}
.cmsg:not(.me) .cmeta{align-items:flex-start}
.cfail{color:#dc2626;font-weight:800}.cwait{color:#1d4ed8;font-weight:700}.cun{color:#f59e0b}
.creply{border:1px solid #93c5fd;background:#fff;color:#1d4ed8;border-radius:99px;font-size:12px;font-weight:700;padding:2px 9px;margin-bottom:3px}.creply:hover,.creply.on{background:#2563eb;color:#fff}
.cb.pick{cursor:pointer}.cb.pick:hover{box-shadow:0 0 0 2px #93c5fd}.cb.sel{box-shadow:0 0 0 3px #2563eb}
.csend:disabled{opacity:.45}
.cinput{background:#fff;border-top:1px solid var(--line)}
.cinput textarea{flex:1;min-height:44px;max-height:160px;border:0;outline:0;resize:none;padding:6px 4px;font-size:15px}
.csend{background:#fee500;border:0;border-radius:8px;padding:10px 16px;font-weight:800;color:#3c1e1e}
.cempty{margin:auto;text-align:center;color:#334155;font-size:15px;line-height:1.7;padding:40px}
@media (max-width:800px){.chat{grid-template-columns:1fr}.croom{min-height:70vh}}
@media (max-width:700px){.form{grid-template-columns:1fr}.dev{width:100%}}
</style>
</head>
<body>

<!-- ───────── 로그인 ───────── -->
<div id="login" class="hidden">
  <h1>🥋 정도 출결 PC 관리</h1>
  <p class="muted">문자 폰·키오스크와 같은 출결 데이터를 PC에서 보고 고쳐요.</p>
  <div id="codeBox">
    <h3>① 연결 코드 (처음 한 번)</h3>
    <p class="muted">관장님 폰 출결 앱 → 설정 맨 아래 <b>💻 PC에서 관리하기</b>의 코드를 붙여넣으세요. ([카톡으로 PC에 보내기]를 누르면 편해요)</p>
    <input type="text" id="codeIn" placeholder="JD1-…">
    <details style="margin:6px 0"><summary class="muted">코드가 안 되면: 파이어베이스 웹 설정 붙여넣기</summary>
      <textarea id="cfgIn" placeholder="const firebaseConfig = { apiKey: ..., projectId: ... }"></textarea>
    </details>
  </div>
  <h3>② 도장 계정</h3>
  <input type="text" id="emailIn" placeholder="이메일 (출결 앱 로그인과 같아요)" autocomplete="username">
  <input type="password" id="pwIn" placeholder="비밀번호" autocomplete="current-password">
  <div class="row" style="margin-top:10px"><button class="btn grow" id="loginBtn">로그인</button></div>
  <p class="muted" id="loginMsg"></p>
  <p class="muted"><a href="#" id="resetCode">연결 코드 다시 넣기</a></p>
</div>

<!-- ───────── 본 화면 ───────── -->
<div id="app" class="hidden">
  <header>
    <h1>🥋 정도 출결 PC</h1>
    <div class="dev"><span id="devServer"><i class="dot"></i>문자 폰</span><span id="devKiosk"><i class="dot"></i>키오스크</span></div>
    <div class="sp"></div>
    <button id="qsmsBtn" style="background:#f5c518;color:#111;font-weight:800">✉️ 문자 보내기</button>
    <span class="who" id="who"></span>
    <button id="logoutBtn">로그아웃</button>
  </header>
  <nav id="tabs">
    <button data-t="today" class="on">오늘 출결</button>
    <button data-t="chat">💬 문자</button>
    <button data-t="roster">원생 명단</button>
    <button data-t="bulk">단체 문자</button>
    <button data-t="month">월간 출석부</button>
    <button data-t="absent">결석 · 받은 문자</button>
    <button data-t="call">📞 전화 대상</button>
    <button data-t="msg">문자 문구 · 오늘 안내</button>
    <button data-t="char">🧸 캐릭터 넣기</button>
  </nav>
  <main><div class="panel" id="panel"></div></main>
</div>

<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, onSnapshot, query, where, orderBy, limit, setDoc, updateDoc, addDoc, deleteDoc, getDoc, getDocs, writeBatch, serverTimestamp, deleteField } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ═════════════ 기본 도우미 ═════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dayOf = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const today = () => dayOf(Date.now());
const thisMonth = () => today().slice(0, 7);
const timeText = ms => { const d = new Date(ms); let h = d.getHours(); const ap = h < 12 ? '오전' : '오후'; h = h % 12 || 12; return `${ap} ${h}:${pad(d.getMinutes())}`; };
const normPhone = s => { let n = String(s || '').replace(/\D/g, ''); if (n.startsWith('82') && n.length >= 11) n = '0' + n.slice(2); return n; };
const prettyPhone = s => s.length === 11 ? `${s.slice(0,3)}-${s.slice(3,7)}-${s.slice(7)}` : s.length === 10 ? `${s.slice(0,3)}-${s.slice(3,6)}-${s.slice(6)}` : s;
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } };
const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch(e){} };

/* ═════════════ 학년 (앱과 같은 계산) ═════════════ */
const thisYear = () => parseInt(today().slice(0, 4), 10);
const PICK = ['유치부','1학년','2학년','3학년','4학년','5학년','6학년','중1','중2','중3','고1','고2','고3','성인'];
const GRADE_ORDER = ['유치부','6~7세','1학년','2학년','3학년','4학년','5학년','6학년','4/5/6/중고등','중학생','중1','중2','중3','중고등','고등학생','고1','고2','고3','성인'];
function labelOf(age){ if (age <= 0) return ''; if (age <= 7) return '유치부'; if (age < 14) return `${age-7}학년`; if (age < 17) return `중${age-13}`; if (age < 20) return `고${age-16}`; return '성인'; }
function ageOf(t){ t = String(t||'').trim(); let m;
  if ((m = t.match(/^([1-6])학년$/))) return 7 + +m[1];
  if ((m = t.match(/^(?:중학교|중)\s*([1-3])(?:학년)?$/))) return 13 + +m[1];
  if ((m = t.match(/^(?:고등학교|고)\s*([1-3])(?:학년)?$/))) return 16 + +m[1];
  return 0; }
const curAge = s => (s.age > 0 && s.ageYear > 0) ? s.age + (thisYear() - s.ageYear) : 0;
const gradeOf = s => curAge(s) > 0 ? labelOf(curAge(s)) : (s.grade || '');
const gradeRank = g => { const i = GRADE_ORDER.indexOf(g); return i < 0 ? 99 : i; };

/* ═════════════ 띠 (앱과 같은 글자·색) ═════════════ */
const COLORS = ['흰띠','흰노띠','노랑띠','노초띠','초록띠','초파띠','파랑띠','보라띠','밤띠','밤빨띠','빨강띠','빨검띠'];
const KUKKIWON = ['1품 1급','2품 1급','3품 1급','빨검띠'];
const JUMP = ['9급','8급','7급','6급','5급','4급','3급','2급','1급'];
const BELT_C = {'흰띠':['#f2f2f2','#f2f2f2'],'흰노띠':['#f2f2f2','#ffd400'],'노랑띠':['#ffd400','#ffd400'],'노초띠':['#ffd400','#2e9e44'],'초록띠':['#2e9e44','#2e9e44'],'초파띠':['#2e9e44','#1565c0'],'파랑띠':['#1565c0','#1565c0'],'보라띠':['#6a1b9a','#6a1b9a'],'밤띠':['#5d3a1a','#5d3a1a'],'밤빨띠':['#5d3a1a','#c62828'],'빨강띠':['#c62828','#c62828'],'빨검띠':['#c62828','#141414']};
function normBelt(raw){ const s = String(raw||'').trim().replace(/\s+/g, ' '); if (!s) return ''; if (COLORS.includes(s)) return s;
  const m = s.match(/^(\d+)\s*품\s*(\d+)?\s*급?$/); if (m){ const p = +m[1]; const g = m[2] ? +m[2] : p * 12; return `${p}품 ${g}급`; } return s; }
function beltRank(b){ b = normBelt(b); const i = COLORS.indexOf(b); if (i >= 0) return i; const m = b.match(/^(\d+)품 (\d+)급$/); return m ? 100 + (+m[1]) * 100 - (+m[2]) : 9999; }
function beltHtml(b){ b = normBelt(b); if (!b) return ''; let c = BELT_C[b];
  if (!c){ const p = (b.match(/^(\d+)품/) || [])[1]; if (p) c = +p >= 3 ? ['#141414','#141414'] : ['#141414','#c62828']; }
  const bar = c ? `<i style="background:linear-gradient(${c[0]} 0 30%, ${c[1]} 30% 70%, ${c[0]} 70%)"></i>` : '';
  return `<span class="belt">${bar}${esc(b)}</span>`; }

/* ═════════════ 연결 ═════════════ */
function parseCode(code){
  code = String(code || '').trim();
  if (!code.startsWith('JD1-')) return null;
  try { const raw = atob(code.slice(4).replace(/-/g, '+').replace(/_/g, '/')); const [projectId, apiKey, storageBucket] = raw.split('|');
    if (!projectId || !apiKey) return null; return { projectId, apiKey, storageBucket, authDomain: `${projectId}.firebaseapp.com` }; } catch(e){ return null; }
}
function parseCfgText(t){
  const g = k => (String(t).match(new RegExp(k + `\\s*["']?\\s*:\\s*["']([^"']+)["']`)) || [])[1];
  const apiKey = g('apiKey'), projectId = g('projectId');
  if (!apiKey || !projectId) return null;
  return { apiKey, projectId, authDomain: g('authDomain') || `${projectId}.firebaseapp.com`, storageBucket: g('storageBucket'), appId: g('appId') };
}
let fb = null, auth = null, db = null;
function connect(cfg){ if (fb) return true; try { fb = initializeApp(cfg); auth = getAuth(fb); db = getFirestore(fb); return true; } catch(e){ $('#loginMsg').textContent = '연결 코드가 이상해요: ' + e.message; return false; } }

function showLogin(){
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#codeBox').classList.toggle('hidden', !!lsGet('jdpc_cfg'));
}
$('#resetCode').onclick = e => { e.preventDefault(); lsSet('jdpc_cfg', ''); location.reload(); };
$('#loginBtn').onclick = async () => {
  const msg = $('#loginMsg'); msg.textContent = '';
  if (!fb){
    const cfg = parseCode($('#codeIn').value) || parseCfgText($('#cfgIn').value);
    if (!cfg){ msg.textContent = '연결 코드를 확인해 주세요 (JD1- 로 시작해요)'; return; }
    if (!connect(cfg)) return;
    lsSet('jdpc_cfg', JSON.stringify(cfg));
    onAuthStateChanged(auth, onAuth);
  }
  try { msg.textContent = '로그인 중…'; await signInWithEmailAndPassword(auth, $('#emailIn').value.trim(), $('#pwIn').value); }
  catch(e){
    const c = e.code || '';
    msg.textContent = c.includes('api-key') || c.includes('referer') || c.includes('blocked')
      ? '이 연결 코드는 PC에서 막혀 있어요. 아래 "파이어베이스 웹 설정 붙여넣기"를 써 주세요 (' + c + ')'
      : c.includes('invalid') || c.includes('wrong-password') || c.includes('user-not-found') ? '이메일 또는 비밀번호가 달라요' : '로그인 실패: ' + (e.message || c);
  }
};
$('#pwIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginBtn').click(); });

/* ─── 공통: 찾기·고르기·정렬 ─── */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const CHO_KEYS = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ';
const BASE_CHO = { 'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ' };
const choseong = s => [...s].map(c => { const k = c.charCodeAt(0) - 0xAC00; return k >= 0 && k < 11172 ? CHO[Math.floor(k / 588)] : c; }).join('');
const cho1 = s => { const c = choseong(s)[0] || ''; return BASE_CHO[c] || c; };
/** 앱과 같은 찾기: 초성만 치면 성 또는 이름 첫 글자부터, 그 밖엔 이름에 들어 있으면 */
function nameMatch(name, q){
  const t = q.replace(/\s/g, ''); if (!t) return true;
  if ([...t].every(c => c >= 'ㄱ' && c <= 'ㅎ')){ const init = choseong(name).split('').map(c => BASE_CHO[c] || c).join(''); const want = [...t].map(c => BASE_CHO[c] || c).join(''); return init.startsWith(want) || init.slice(1).startsWith(want); }
  if (/^\d+$/.test(t)) return false;
  return name.includes(t);
}
/** 나이(세): 나이가 저장돼 있으면 그대로, 없으면 학년 글자로 */
const ageKey = s => curAge(s) || ageOf(gradeOf(s)) || 0;
const newF = () => ({ q: '', cho: new Set(), grades: new Set(), ages: new Set(), belts: new Set(), sort: 'name' });
function applyF(list, F){
  return list.filter(s =>
    (!F.q || nameMatch(s.name, F.q) || (/\d{3,}/.test(F.q) && (s.attendNo.includes(F.q) || s.phones.some(x => normPhone(x).includes(F.q.replace(/\D/g, '')))))) &&
    (!F.cho.size || F.cho.has(cho1(s.name)) || F.cho.has(cho1(givenName(s.name)))) &&
    (!F.grades.size || F.grades.has(gradeOf(s))) &&
    (!F.ages.size || F.ages.has(String(ageKey(s)))) &&
    (!F.belts.size || F.belts.has(normBelt(s.belt) || '띠 없음')));
}
const SORTS = [['name','가나다순'],['nameDesc','가나다 거꾸로'],['ageAsc','나이 어린 순'],['ageDesc','나이 많은 순'],['beltDesc','띠 높은 순'],['beltAsc','띠 낮은 순'],['no','출결번호 순']];
function sortF(list, sort){
  const nm = (a, b) => a.name.localeCompare(b.name, 'ko');
  const ak = s => ageKey(s) || 999;
  const f = {
    name: nm, nameDesc: (a, b) => -nm(a, b),
    ageAsc: (a, b) => ak(a) - ak(b) || nm(a, b),
    ageDesc: (a, b) => (ageKey(b) || -1) - (ageKey(a) || -1) || nm(a, b),
    beltDesc: (a, b) => (beltRank(b.belt) % 9999) - (beltRank(a.belt) % 9999) || nm(a, b),
    beltAsc: (a, b) => beltRank(a.belt) - beltRank(b.belt) || nm(a, b),
    no: (a, b) => (parseInt(a.attendNo, 10) || 1e9) - (parseInt(b.attendNo, 10) || 1e9) || nm(a, b),
  }[sort] || nm;
  return [...list].sort(f);
}
/** 찾기 칸 + 초성·학년·나이·띠 버튼 + 정렬 (누르면 목록만 다시 그림 → 한글 입력이 안 끊김) */
function filterBarHtml(F, kids, withSort = true){

  const ages = [...new Set(kids.map(ageKey).filter(Boolean))].sort((a, b) => a - b);
  const belts = [...new Set(kids.map(s => normBelt(s.belt)).filter(Boolean))].sort((a, b) => beltRank(a) - beltRank(b));
  const pills = (key, arr, label) => arr.length ? `<div class="row" style="gap:5px;margin-top:6px"><span class="muted" style="width:34px">${label}</span>${arr.map(v => `<button class="pill ${F[key].has(String(v)) ? 'on' : ''}" data-fk="${key}" data-fv="${esc(v)}" style="padding:3px 10px;font-size:13.5px">${esc(key === 'ages' ? v + '세' : v)}</button>`).join('')}</div>` : '';
  return `<div class="fbar">
    <div class="row"><input type="text" data-fq placeholder="이름 · 초성(ㄱㅅㅇ) · 출결번호 · 전화번호" value="${esc(F.q)}" style="width:290px">
      ${withSort ? `<select data-fsort>${SORTS.map(([k, l]) => `<option value="${k}" ${F.sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select>` : ''}
      <button class="pill" data-fclear>찾기 조건 지우기</button></div>
    ${pills('cho', [...CHO_KEYS], '초성')}${pills('grades', grades, '학년')}${pills('ages', ages, '나이')}${pills('belts', belts.length ? [...belts, '띠 없음'] : [], '띠')}
  </div>`;
}
function bindFilterBar(root, F, redraw){
  const q = root.querySelector('[data-fq]');
  q.addEventListener('input', e => { F.q = q.value; if (!e.isComposing) redraw(); });

  root.querySelectorAll('[data-fk]').forEach(b => b.onclick = () => { const set = F[b.dataset.fk], v = b.dataset.fv; set.has(v) ? set.delete(v) : set.add(v); b.classList.toggle('on', set.has(v)); redraw(); });

/* ─── 통합관리 띠와 비교·맞추기 (PC에서 직접 받아서 비교) ─── */
const BS_URL = 'https://taekwondo-wordgame-default-rtdb.asia-southeast1.firebasedatabase.app/apps/pub_beltsync/data/blob.json';
const b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function bsFetch(pw){
  const r = await fetch(BS_URL, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status);
  const o = await r.json(); if (!o) throw new Error('통합관리에서 아직 띠를 보내지 않았어요');
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64u8(o.s), iterations: o.n || 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  let plain; try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u8(o.i) }, key, b64u8(o.d)); } catch(e){ throw new Error('비밀번호가 통합관리와 달라요'); }
  const d = JSON.parse(new TextDecoder().decode(plain));
  const list = Array.isArray(d.l) ? d.l.map(x => ({ n: String(x.n || '').trim(), g: String(x.g || '').trim(), b: normBelt(x.b) })) : Object.entries(d.b || {}).map(([n, b]) => ({ n: n.trim(), g: '', b: normBelt(b) }));
  return { t: o.t || d.t, list };
}
/* 출결에서 직접 고친(📌) 띠 → 통합관리로 (통합관리가 1분마다 받아 감). 비밀번호는 [통합관리 띠와 비교]에서 한 번 넣으면 기억 */
const BS_BACK = BS_URL.replace('/blob.json', '/back.json');
let bsBackSig = '';
const u8b64 = u8 => { let x = ''; u8.forEach(c => x += String.fromCharCode(c)); return btoa(x); };
async function bsEncrypt(pw, text){
  const enc = new TextEncoder(), n = 150000, salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
  const d = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text)));
  return { v: 1, n, t: Date.now(), s: u8b64(salt), i: u8b64(iv), d: u8b64(d) };
}
async function bsPushBack(force){
  const pw = lsGet('jdpc_beltpw'); if (!pw || !S.students.length) return;
  const l = S.students.filter(s => s.status !== 'LEFT' && s.beltManual && s.belt).sort((a, b) => a.id < b.id ? -1 : 1)
    .map(s => ({ n: s.name.trim(), g: gradeOf(s), a: curAge(s), b: normBelt(s.belt), at: s.beltAt || 1 }));
  const sig = pw.length + JSON.stringify(l); if (!force && sig === bsBackSig) return;
  try { const r = await fetch(BS_BACK, { method: 'PUT', body: JSON.stringify(await bsEncrypt(pw, JSON.stringify({ t: Date.now(), l }))) }); if (r.ok) bsBackSig = sig; } catch(e){}
}
setInterval(() => bsPushBack(false), 120000);
function catOf(raw, age){
  if (age > 0) return age <= 7 ? 0 : age <= 13 ? 1 : age <= 16 ? 2 : age <= 19 ? 3 : 4;
  const g = String(raw || '').replace(/\s/g, ''); if (!g) return -1;
  if (/유치|세|살/.test(g)) return 0; if (g.startsWith('중')) return 2; if (g.startsWith('고')) return 3; if (g.includes('성인')) return 4; if (g.startsWith('초') || g.includes('학년')) return 1; return -1;
}
function gradeKeyOf(raw){
  const g = String(raw || '').replace(/\s/g, ''); const m = g.match(/(\d+)/); if (!m) return 99; const n = +m[1];
  if (/세|살/.test(g)) return n; if (g.startsWith('중')) return 13 + n; if (g.startsWith('고')) return 16 + n; if (g.includes('학년') || g.startsWith('초')) return 7 + n; return 99;
}
/** 앱(문자 폰)과 똑같은 규칙으로 아이마다 통합관리 띠를 찾음 → { id: {belt, how} } */
function matchBelts(list){
  const out = {};
  const byName = {}; list.filter(e => e.b).forEach(e => (byName[e.n] = byName[e.n] || []).push(e));
  const groups = {}; S.students.filter(s => s.status !== 'LEFT').forEach(s => (groups[s.name.trim()] = groups[s.name.trim()] || []).push(s));
  Object.entries(groups).forEach(([name, kids]) => {
    const cands = byName[name]; if (!cands) return;
    const sAge = s => curAge(s) || gradeKeyOf(gradeOf(s)); const sCat = s => catOf(gradeOf(s), curAge(s));
    if (kids.length === 1 && cands.length === 1){
      const sc = sCat(kids[0]), ec = catOf(cands[0].g, 0);
      out[kids[0].id] = sc >= 0 && ec >= 0 && sc !== ec ? { belt: '', how: `통합관리 ${name}(${cands[0].g})은 다른 아이 같아요` } : { belt: cands[0].b, how: '' };
      return;
    }
    const left = [...cands], rest = [];
    kids.forEach(s => {
      let hit = left.filter(e => sAge(s) < 99 && gradeKeyOf(e.g) === sAge(s));
      if (hit.length !== 1) hit = left.filter(e => sCat(s) >= 0 && catOf(e.g, 0) === sCat(s));
      if (hit.length === 1){ out[s.id] = { belt: hit[0].b, how: `이름 같은 아이 · 학년으로 구분(${hit[0].g})` }; left.splice(left.indexOf(hit[0]), 1); } else rest.push(s);
    });
    if (rest.length){
      if (rest.length === left.length){ const ls = [...left].sort((a, b) => beltRank(a.b) - beltRank(b.b)); [...rest].sort((a, b) => sAge(a) - sAge(b)).forEach((s, i) => out[s.id] = { belt: ls[i].b, how: '이름 같은 아이 · 나이 순으로 짝지음' }); }
      else rest.forEach(s => out[s.id] = { belt: '', how: '이름 같은 아이를 구분 못 함' });
    }
  });
  return out;
}

const HOLI = {'2026-01-01':1,'2026-02-16':1,'2026-02-17':1,'2026-02-18':1,'2026-03-01':1,'2026-03-02':1,'2026-05-01':1,'2026-05-05':1,'2026-05-24':1,'2026-05-25':1,'2026-06-03':1,'2026-06-06':1,'2026-07-17':1,'2026-08-15':1,'2026-08-17':1,'2026-09-24':1,'2026-09-25':1,'2026-09-26':1,'2026-10-03':1,'2026-10-05':1,'2026-10-09':1,'2026-12-25':1,
  '2027-01-01':1,'2027-02-06':1,'2027-02-07':1,'2027-02-08':1,'2027-02-09':1,'2027-03-01':1,'2027-05-01':1,'2027-05-03':1,'2027-05-05':1,'2027-05-13':1,'2027-06-06':1,'2027-07-17':1,'2027-07-19':1,'2027-08-15':1,'2027-08-16':1,'2027-09-14':1,'2027-09-15':1,'2027-09-16':1,'2027-10-03':1,'2027-10-04':1,'2027-10-09':1,'2027-10-11':1,'2027-12-25':1,'2027-12-27':1};
const shiftDay = (d, n) => { const t = new Date(d + 'T12:00:00'); t.setDate(t.getDate() + n); return dayOf(t.getTime()); };
const CS = { ev: [], ab: [], hol: {}, loadedDay: '' };
function isOff(d){ const c = CS.hol[d]; if (c === '수업') return false; const w = new Date(d + 'T12:00:00').getDay(); return w === 0 || w === 6 || !!c || !!HOLI[d]; }
async function loadCall(){
  CS.loadedDay = today(); const from = shiftDay(today(), -70);
  const [e, a, h] = await Promise.all([
    getDocs(query(collection(db, 'events'), where('day', '>=', from))),
    getDocs(query(collection(db, 'absences'), where('day', '>=', from))),
    getDoc(doc(db, 'config', 'holidays')),
  ]);
  CS.ev = e.docs.map(d => d.data()).filter(x => x.type === 'IN'); CS.ab = a.docs.map(d => d.data()); CS.hol = (h.exists() && h.get('days')) || {};
}
function callList(){
  const yest = shiftDay(today(), -1);
  const att = {}; CS.ev.forEach(e => (att[e.studentId] = att[e.studentId] || new Set()).add(e.day));
  S.todayEv.filter(e => e.type === 'IN').forEach(e => (att[e.studentId] = att[e.studentId] || new Set()).add(e.day));
  const exc = {}; CS.ab.forEach(a => (exc[a.studentId] = exc[a.studentId] || new Set()).add(a.day));
  const from70 = shiftDay(today(), -70), recent = shiftDay(today(), -14);
  return active().map(s => {
    const days = att[s.id] || new Set(), ex = exc[s.id] || new Set();
    const last = [...days].filter(d => d <= today()).sort().pop();
    if (!last) return null;
    if (days.has(today())) return null;
    let gap = 0; for (let d = shiftDay(last, 1); d <= yest; d = shiftDay(d, 1)) if (!isOff(d) && !ex.has(d)) gap++;
    let open = 0, came = 0; const st = s.joinedMonth && s.joinedMonth + '-01' > from70 ? s.joinedMonth + '-01' : from70;
    for (let d = st; d < recent; d = shiftDay(d, 1)) if (!isOff(d) && !ex.has(d)){ open++; if (days.has(d)) came++; }
    const usual = open >= 5 ? came / open : 0.8;
    const need = gap >= 2 && (usual >= 0.5 || gap * Math.max(usual, 0.3) >= 1.6);
    return need ? { s, gap, last, usual } : null;
  }).filter(Boolean).sort((a, b) => b.gap - a.gap);
}

const givenName = n => (n.trim().length === 3 && /^[가-힣]+$/.test(n.trim())) ? n.trim().slice(1) : n.trim();
function buildReply(tpl, names, label){
  const d = today(); const dateText = `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일`;
  const ho = !label || label === '보호자' ? '보호자님' : label;
  return tpl.split('{이름}').join(names.map(givenName).join(', ')).split('{성명}').join(names.join(', ')).split('{호칭}').join(ho).split('{날짜}').join(dateText).trim();
}
function buildItems(tpl, kids, allPhones){
  const byPhone = new Map(), noPhone = [];
  kids.forEach(s => {
    const all = []; s.phones.forEach((p, i) => { const n = normPhone(p); if (n.length >= 9 && !all.some(x => x[0] === n)) all.push([n, s.phoneLabels[i] || '보호자']); });
    const use = allPhones ? all : all.slice(0, 1);
    if (!use.length) noPhone.push(s.name);
    use.forEach(([p, l]) => { if (!byPhone.has(p)) byPhone.set(p, []); byPhone.get(p).push([s, l]); });
  });
  const list = [...byPhone].map(([p, arr]) => ({ n: arr.map(x => x[0].name).join(', '), p, t: buildReply(tpl || '', arr.map(x => x[0].name), arr[0][1]) }));
  return { list, noPhone };
}

const MS = { month: thisMonth(), ev: [], ab: [], hol: {}, loaded: '' , unsub: [] };

  MS.unsub.push(onSnapshot(query(collection(db, 'events'), where('day', '>=', from), where('day', '<=', to)), snap => { MS.ev = snap.docs.map(d => d.data()); if (S.tab === 'month') render(); }));

  getDoc(doc(db, 'config', 'holidays')).then(d => { MS.hol = (d.exists() && d.get('days')) || {}; if (S.tab === 'month') render(); }).catch(() => {});

function monthTable(){

  return { days, rows, abMap };
}

const CH = { cur: '', q: '', ev: [], evLoaded: false, showAttend: false, unsub: null };
function phoneOwners(p){
  const out = [];
  S.students.forEach(s => s.phones.forEach((x, i) => { if (normPhone(x) === p) out.push({ s, label: s.phoneLabels[i] || '보호자' }); }));
  return out;
}
function convTitle(p){
  const o = phoneOwners(p);
  if (!o.length) return { name: prettyPhone(p), sub: '등록 안 된 번호' };
  const names = [...new Set(o.map(x => x.s.name))].join(', ');
  return { name: `${names} ${o[0].label}`, sub: `${o.map(x => x.s.name).filter((v, i, a) => a.indexOf(v) === i).join(', ')} · ${prettyPhone(p)}` };
}
/** 번호별 대화: 받은 문자 + 보낸 단체/PC 문자 + (선택) 등원·하원 알림 */
function buildConvs(){
  const m = new Map();
  const put = (p, msg) => { p = normPhone(p); if (p.length < 9) return; if (!m.has(p)) m.set(p, []); m.get(p).push(msg); };
  S.inbox.forEach(x => {
    put(x.from, { at: x.at || 0, me: false, text: x.body || '', unread: !x.handled, id: x.id });
    if (x.reply) put(x.from, { at: (x.at || 0) + 1, me: true, text: x.reply, st: x.replyError ? 'fail' : 'ok', err: x.replyError });
  });
  S.bulkAll.forEach(j => (j.items || []).forEach((it, i) => {
    const r = (j.results || {})[i];
    put(it.p, { at: j.createdMs || 0, me: true, text: it.t || '', st: r === 'OK' ? 'ok' : r ? 'fail' : (j.status === 'DONE' ? 'fail' : 'wait'), err: r && r !== 'OK' ? r : '', title: j.title });
  }));
  if (CH.showAttend) CH.ev.forEach(e => {
    if (!e.message) return;
    const targets = e.matchedPhone ? [e.matchedPhone] : (e.phones || []);
    targets.forEach(p => put(p, { at: e.sentMs || e.clientTime || 0, me: true, text: e.message, st: e.status === 'SENT' ? 'ok' : e.status === 'FAILED' ? 'fail' : 'wait', attend: true }));
  });
  m.forEach((list, p) => { const h = S.chatHidden[p] || 0; const keep = list.filter(x => x.at > h).sort((a, b) => a.at - b.at); if (keep.length) m.set(p, keep); else m.delete(p); });
  return m;
}

  const keys = Object.keys(S.chatHidden);
  const nameOf = k => k.startsWith('g:') ? '👥 ' + ((S.bulkAll.find(j => 'g:' + j.id === k) || {}).title || '단체방') : convTitle(k).name;
  const m = modal(`<h2>나간 대화방 ${keys.length}개</h2><div style="max-height:60vh;overflow:auto">${keys.map(k => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><b class="grow">${esc(nameOf(k))}</b><span class="muted">${new Date(S.chatHidden[k]).toLocaleDateString('ko-KR')} 나감</span><button class="btn small" data-uh="${esc(k)}">되살리기</button></div>`).join('')}</div><div class="row" style="margin-top:12px"><div class="grow"></div><button class="btn ghost" id="uclose">닫기</button></div>`);
  m.querySelector('#uclose').onclick = closeModal;
  m.querySelectorAll('[data-uh]').forEach(b => b.onclick = async () => { await updateDoc(doc(db, 'config', 'pcChat'), { ['hidden.' + b.dataset.uh]: deleteField() }); b.closest('.row').remove(); toast('되살렸어요'); });
}
function groupJobs(){ return S.bulkAll.filter(j => (j.items || []).length > 1 && !j.parent && !String(j.title || '').startsWith('💬')); }
/** 방에 들어갈 것: 내가 보낸 단체 문자 + 보낸 뒤 그 사람들이 보낸 답장 + 내가 그 사람에게 따로 보낸 답장 */
function groupMsgs(j){
  const phones = new Map((j.items || []).map(it => [normPhone(it.p), it.n]));
  const from = j.createdMs || 0;
  const res = j.results || {}; const n = (j.items || []).length;
  const ok = Object.values(res).filter(v => v === 'OK').length, fail = Object.values(res).filter(v => v !== 'OK').length;
  const out = [{ at: from, me: true, all: true, text: (j.items[0] || {}).t || '', st: j.status === 'DONE' ? (fail ? 'fail' : 'ok') : 'wait', info: `${n}명에게 · 성공 ${ok}${fail ? ` · 실패 ${fail}` : ''}${j.status !== 'DONE' ? ' · 보내는 중' : ''}` }];
  S.inbox.forEach(x => { const p = normPhone(x.from); if (phones.has(p) && (x.at || 0) >= from) out.push({ at: x.at || 0, me: false, p, text: x.body || '', unread: !x.handled, id: x.id }); });
  // 같은 방에서 다시 보낸 것 (모두 / 답장 없는 분만)
  S.bulkAll.filter(o => o.parent === j.id).forEach(o => { const r = o.results || {}; const n = (o.items || []).length; const ok = Object.values(r).filter(v => v === 'OK').length, fl = Object.values(r).filter(v => v !== 'OK').length;
    out.push({ at: o.createdMs || 0, me: true, all: true, label: o.label || '📢 모두에게', text: (o.items[0] || {}).t || '', st: o.status === 'DONE' ? (fl ? 'fail' : 'ok') : 'wait', info: `${n}명에게 · 성공 ${ok}${fl ? ` · 실패 ${fl}` : ''}${o.status !== 'DONE' ? ' · 보내는 중' : ''}` }); });
  S.bulkAll.forEach(o => { if (o.id === j.id || o.parent || (o.createdMs || 0) < from || (o.items || []).length !== 1) return; const it = o.items[0]; const p = normPhone(it.p);
    if (phones.has(p)) { const r = (o.results || {})[0]; out.push({ at: o.createdMs, me: true, p, text: it.t, st: r === 'OK' ? 'ok' : r ? 'fail' : (o.status === 'DONE' ? 'fail' : 'wait'), err: r && r !== 'OK' ? r : '' }); } });
  out.sort((a, b) => a.at - b.at);
  const h = S.chatHidden['g:' + j.id] || 0;
  return { out: out.filter(x => x.at > h), phones };
}
function groupListHtml(){
  const jobs = groupJobs().map(j => { const g = groupMsgs(j); if (!g.out.length) return null; const last = g.out[g.out.length - 1]; return { j, last, unread: g.out.filter(x => x.unread).length, replies: g.out.filter(x => !x.me).length }; })
    .filter(Boolean).sort((a, b) => b.last.at - a.last.at).slice(0, 30);
  if (!jobs.length) return '';
  return `<div class="muted" style="padding:8px 12px 2px;font-weight:700">👥 단체방</div>` + jobs.map(x => `<div class="citem ${CH.cur === 'g:' + x.j.id ? 'on' : ''}" data-cp="g:${x.j.id}">
      <div class="cav" style="background:#7c9fc0">👥</div>
      <div class="cmid"><div class="row" style="gap:6px"><b class="grow cname">${esc(x.j.title || '단체 문자')} <span class="muted" style="font-weight:400">${x.j.items.length}</span></b><span class="muted" style="font-size:12px">${new Date(x.last.at).toDateString() === new Date().toDateString() ? hm(x.last.at) : `${new Date(x.last.at).getMonth() + 1}/${new Date(x.last.at).getDate()}`}</span></div>
        <div class="row" style="gap:6px"><span class="cprev grow">${x.replies ? `답장 ${x.replies}개 · ` : ''}${esc(x.last.text.replace(/\n/g, ' '))}</span>${x.unread ? `<span class="cbadge">${x.unread}</span>` : ''}</div></div></div>`).join('')
    + `<div class="muted" style="padding:8px 12px 2px;font-weight:700">💬 1:1 대화</div>`;
}
function drawGroupRoom(room){
  const j = S.bulkAll.find(x => 'g:' + x.id === CH.cur);
  if (!j){ room.innerHTML = '<div class="cempty">단체방을 찾을 수 없어요</div>'; return; }
  const { out, phones } = groupMsgs(j);
  const who = p => { const t = convTitle(p); return t.name; };
  CH.gTarget = CH.gTarget && (CH.gTarget === 'ALL' || CH.gTarget === 'NOREPLY' || phones.has(CH.gTarget)) ? CH.gTarget : '';
  let lastDay = '';
  const bubbles = out.map(x => {
    const d = dayOf(x.at); let sep = ''; if (d !== lastDay){ lastDay = d; sep = `<div class="cday"><span>${dayTitle(x.at)}</span></div>`; }
    if (x.me){
      const st = x.st === 'ok' ? '' : x.st === 'fail' ? `<span class="cfail" title="${esc(x.err || '')}">실패</span>` : `<span class="cwait">보내는 중</span>`;
      return sep + `<div class="cmsg me"><div class="cmeta">${st}<span>${hm(x.at)}</span></div><div class="cb me">${x.all ? `<div class="ctag">${esc(x.label || '📢 모두에게')} · ${esc(x.info)}</div>` : `<div class="ctag">↪ ${esc(who(x.p))}께만</div>`}${esc(x.text)}</div></div>`;
    }
    const nm = who(x.p);
    return sep + `<div class="cmsg"><div class="cav sm">${esc(nm[0])}</div><div><div class="cwho">${esc(nm)}</div><div class="row" style="align-items:flex-end;gap:6px;flex-wrap:nowrap">
      <div class="cb pick ${CH.gTarget === x.p ? 'sel' : ''}" data-gp="${x.p}" title="눌러서 이 분께만 답장">${esc(x.text)}</div><div class="cmeta"><button class="creply ${CH.gTarget === x.p ? 'on' : ''}" data-gp="${x.p}">↪ 답장</button><span>${hm(x.at)}</span>${x.unread ? '<span class="cun">●</span>' : ''}</div></div></div></div>`;
  }).join('');
  const replied = new Set(out.filter(x => !x.me).map(x => x.p));
  const noReply = [...phones.keys()].filter(p => !replied.has(p));
  const unreadIds = out.filter(x => x.unread).map(x => x.id);
  const headHtml = `<div class="grow"><b style="font-size:16px">👥 ${esc(j.title || '단체 문자')}</b><div class="muted">${phones.size}명 · 답장 ${replied.size}명 · 아직 답 없음 ${noReply.length}명</div></div>
    ${unreadIds.length ? `<button class="btn small ghost" id="cread">받은 답장 ${unreadIds.length}개 처리 완료</button>` : ''}
    <button class="btn small ghost" id="gmem">참여자 보기</button><button class="btn small ghost" id="cleave">나가기</button>`;
  const targetHtml = `<span class="muted">받는 사람</span>
    <button class="pill ${CH.gTarget === 'ALL' ? 'on' : ''}" data-gt="ALL">📢 모두 (${phones.size}명)</button>
    ${noReply.length ? `<button class="pill ${CH.gTarget === 'NOREPLY' ? 'on' : ''}" data-gt="NOREPLY">🔕 답장 없는 분만 (${noReply.length}명)</button>` : ''}
    ${CH.gTarget && CH.gTarget !== 'ALL' && CH.gTarget !== 'NOREPLY' ? `<button class="pill on" data-gt="${CH.gTarget}">↪ ${esc(who(CH.gTarget))}께만 ✕</button>` : '<span class="muted" style="font-size:12.5px">말풍선 옆 [↪ 답장]을 누르면 그 분께만 보내요</span>'}`;
  const bindHead = () => {
    const rd = $('#cread'); if (rd) rd.onclick = async () => { const b = writeBatch(db); unreadIds.forEach(id => b.set(doc(db, 'inbox', id), { handled: true }, { merge: true })); await b.commit(); toast('처리 완료로 표시했어요'); };
    $('#cleave').onclick = () => leaveRoom('g:' + j.id, j.title || '단체방');
    $('#gmem').onclick = () => { const m = modal(`<h2>참여자 ${phones.size}명</h2><div style="max-height:60vh;overflow:auto">${[...phones.keys()].map(p => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><b class="grow">${esc(who(p))}</b><span class="muted">${esc(prettyPhone(p))}</span>${replied.has(p) ? '<span class="tag t-ok">답장함</span>' : '<span class="tag t-gray">아직</span>'}<button class="btn small ghost" data-mp="${p}">1:1 대화</button></div>`).join('')}</div><div class="row" style="margin-top:12px"><div class="grow"></div><button class="btn ghost" id="mclose">닫기</button></div>`);
      m.querySelector('#mclose').onclick = closeModal; m.querySelectorAll('[data-mp]').forEach(b => b.onclick = () => { CH.cur = b.dataset.mp; closeModal(); drawChat(); }); };
  };
  const bindBody = () => room.querySelectorAll('[data-gp]').forEach(b => b.onclick = () => { CH.gTarget = b.dataset.gp; drawGroupRoom(room); $('#ctext').focus(); });
  const bindTarget = () => room.querySelectorAll('[data-gt]').forEach(b => b.onclick = () => { CH.gTarget = CH.gTarget === b.dataset.gt ? '' : b.dataset.gt; drawGroupRoom(room); });
  if (room.dataset.p === CH.cur && $('#ctext')){
    $('#croomHead').innerHTML = headHtml; $('#gtarget').innerHTML = targetHtml;
    const body = $('#cbody'); const atEnd = body.scrollHeight - body.scrollTop - body.clientHeight < 80; body.innerHTML = bubbles; if (atEnd) body.scrollTop = body.scrollHeight;
    $('#csend').disabled = !CH.gTarget; CH.gNoReply = noReply; bindHead(); bindBody(); bindTarget(); return;
  }
  room.dataset.p = CH.cur;
  room.innerHTML = `
    <div class="croomHead" id="croomHead">${headHtml}</div>
    <div class="cbody" id="cbody">${bubbles}</div>
    <div class="cinput">
      <div class="row" id="gtarget" style="gap:6px;padding:8px 10px 0">${targetHtml}</div>
      <div class="row" style="padding:8px 10px;gap:8px;align-items:flex-end;flex-wrap:nowrap">
        <textarea id="ctext" placeholder="답장 입력 (Enter 보내기 · Shift+Enter 줄바꿈) — {이름} {호칭} 쓸 수 있어요" rows="2"></textarea>
        <button class="csend" id="csend" ${CH.gTarget ? '' : 'disabled'}>전송</button></div>
    </div>`;
  const body = $('#cbody'); body.scrollTop = body.scrollHeight;
  const ta = $('#ctext');
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendGroup(j, phones); } });
  $('#csend').onclick = () => sendGroup(j, phones);
  CH.gNoReply = noReply;
  bindHead(); bindBody(); bindTarget();
}
async function sendGroup(j, phones){
  const ta = $('#ctext'); const text = ta.value.trim(); if (!text) return;
  if (!CH.gTarget) return toast('받는 사람을 고르세요 (답장 말풍선을 누르거나 📢 모두)');
  const now = Date.now();
  const mk = p => { const o = phoneOwners(p); return { n: convTitle(p).name, p, t: buildReply(text, o.map(x => x.s.name).filter((v, i, a) => a.indexOf(v) === i), o[0] ? o[0].label : '') }; };
  if (CH.gTarget === 'ALL' || CH.gTarget === 'NOREPLY'){
    const list = CH.gTarget === 'ALL' ? [...phones.keys()] : (CH.gNoReply || []);
    if (!list.length) return toast('보낼 사람이 없어요');
    const label = CH.gTarget === 'ALL' ? '📢 모두에게' : '🔕 답장 없는 분께';
    if (!confirm(`${label.replace(/^\S+\s/, '')} ${list.length}명에게 보낼까요?\n\n${list.map(p => convTitle(p).name).join(', ')}`)) return;
    await addDoc(collection(db, 'bulk'), { title: `${j.title || '단체 문자'} (${label.replace(/^\S+\s/, '')})`, parent: j.id, label, createdMs: now, lastMs: now, status: 'PENDING', items: list.map(mk), results: {} });
    toast(`${list.length}명에게 보냈어요`); CH.gTarget = '';
  } else {
    const it = mk(CH.gTarget);
    await addDoc(collection(db, 'bulk'), { title: `💬 ${it.n}`, createdMs: now, lastMs: now, status: 'PENDING', items: [it], results: {} });
  }
  ta.value = '';
}

/* ─── 엑셀 ─── */
function exportXlsx(rows, file, sheet){
  if (!window.XLSX){ toast('엑셀 도구를 못 불러왔어요'); return; }
  const ws = XLSX.utils.aoa_to_sheet(rows); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheet.slice(0, 31)); XLSX.writeFile(wb, file);
}
</script>
