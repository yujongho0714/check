<meta name="robots" content="noindex, noai, noimageai">
<meta name="theme-color" content="#0c1428">
<title>차량 위치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--yjh7b1e2a-c4d1:0}
:root{--bg:#f1f4fa;--navy:#0c1428;--gold:#f5c518;--ink:#111827;--sub:#6b7280;--line:#e5e7eb;--ok:#16a34a;--warn:#f59e0b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:max(16px,env(safe-area-inset-top)) 16px 18px}
header small{color:#c9d3ee;font-size:13px}
header h1{margin:4px 0 0;font-size:21px;font-weight:900;letter-spacing:-.3px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
.hero{background:#fff;border-radius:20px;margin-top:-6px;padding:18px;box-shadow:0 8px 24px rgba(12,20,40,.12);position:relative;top:-4px}
.hero .lab{font-size:13px;color:var(--sub);font-weight:700}
.hero .big{font-size:30px;font-weight:900;margin:4px 0;letter-spacing:-.5px}
.hero .big.ok{color:var(--ok)}.hero .big.go{color:#1d4ed8}
.hero .line{font-size:15px;color:#374151;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:13px;font-weight:800}
.pill.live{background:#dcfce7;color:#15803d}.pill.wait{background:#f3f4f6;color:#4b5563}.pill.done{background:#dbeafe;color:#1d4ed8}.pill.lost{background:#fef3c7;color:#b45309}
.dot{width:9px;height:9px;border-radius:50%;background:#16a34a;animation:p 1s infinite}@keyframes p{50%{opacity:.25}}
#map{height:300px;border-radius:18px;overflow:hidden;margin-top:14px;border:1px solid var(--line);background:#e5e7eb}
.tl{background:#fff;border-radius:18px;padding:14px 14px 4px;margin-top:14px;border:1px solid var(--line)}
.st{display:flex;gap:12px;position:relative;padding-bottom:14px}
.st:not(:last-child)::before{content:'';position:absolute;left:13px;top:28px;bottom:0;width:4px;background:#cbd5e1;border-radius:2px}
.st.done:not(:last-child)::before{background:var(--ok)}
.d{width:30px;height:30px;flex:none;border-radius:50%;background:#fff;border:4px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#64748b;z-index:1}
.st.done .d{background:var(--ok);border-color:var(--ok);color:#fff}
.st.next .d{border-color:var(--warn);color:#b45309;box-shadow:0 0 0 5px #fef3c7}
.st.mine .nm{color:#1d4ed8}
.st .nm{font-weight:900;font-size:16px}.st .tm{color:var(--sub);font-size:13.5px;margin-top:1px}
.mytag{background:#1d4ed8;color:#fff;border-radius:6px;font-size:11.5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.arr{color:var(--ok);font-weight:800}
.car{margin:-4px 0 12px 42px;background:#ecfdf5;border:1px dashed var(--ok);border-radius:10px;padding:7px 10px;font-size:13.5px;font-weight:700}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:16px;line-height:1.6}
.err{background:#fff;border-radius:18px;padding:24px;margin-top:20px;text-align:center;color:#374151}
</style>
</head>
<body>
<header><small id="dojo">용인대 정도 태권도 2관</small><h1 id="ttl">차량 위치</h1></header>
<div class="wrap" id="app"><div class="err">불러오는 중…</div></div>
<script>
const PUB = 'https://taekwondo-wordgame-default-rtdb.asia-southeast1.firebasedatabase.app/apps/pub_bus/data/';
const Q = new URLSearchParams(location.search), KEY = (Q.get('k') || '').replace(/[^a-z0-9]/gi, ''), MY = Q.has('s') ? +Q.get('s') : -1;
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const hm = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function dist(a, b){ if (!a || !b || a.lat == null || b.lat == null) return Infinity; const R = 6371000, t = x => x * Math.PI / 180, dLa = t(b.lat - a.lat), dLo = t(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
let M = null, mapKind = '', fitted = false;
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function mapInit(R){
  if (M) return;
  const el = document.getElementById('map'); if (!el) return;
  const c = (R.stops || []).find(s => s.lat != null) || { lat: 37.0043, lng: 127.263 };
  if (R.naverId && !window.__nf){
    try { window.navermap_authFailure = () => { window.__nf = true; };
      await loadScript(`https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(R.naverId)}`);
      if (window.naver && naver.maps){ mapKind = 'naver'; const N = naver.maps, ll = (a, b) => new N.LatLng(a, b);
        const map = new N.Map(el, { center: ll(c.lat, c.lng), zoom: 15 });
        const pin = (p, html) => new N.Marker({ position: ll(p.lat, p.lng), map, icon: { content: html, anchor: new N.Point(15, 15) } });
        M = { stops: [], car: null,
          draw(stops, car){ this.stops.forEach(m => m.setMap(null)); this.stops = stops.filter(s => s.lat != null).map(s => pin(s, s.html));
            if (car){ if (!this.car) this.car = pin(car, car.html); else this.car.setPosition(ll(car.lat, car.lng)); } else if (this.car){ this.car.setMap(null); this.car = null; } },
          fit(pts){ pts = pts.filter(p => p && p.lat != null); if (!pts.length) return; const b = new N.LatLngBounds(ll(pts[0].lat, pts[0].lng), ll(pts[0].lat, pts[0].lng)); pts.forEach(p => b.extend(ll(p.lat, p.lng))); map.fitBounds(b, { top: 30, right: 30, bottom: 30, left: 30 }); } };
        return; }
    } catch(e){}
  }
  document.head.insertAdjacentHTML('beforeend', '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js');
  mapKind = 'leaflet';
  const map = L.map(el, { attributionControl: true }).setView([c.lat, c.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  const icon = (html, s) => L.divIcon({ html, className: '', iconSize: [s, s], iconAnchor: [s / 2, s / 2] });
  M = { stops: [], car: null,
    draw(stops, car){ this.stops.forEach(m => m.remove()); this.stops = stops.filter(s => s.lat != null).map(s => L.marker([s.lat, s.lng], { icon: icon(s.html, 30) }).addTo(map));
      if (car){ if (!this.car) this.car = L.marker([car.lat, car.lng], { icon: icon(car.html, 40), zIndexOffset: 1000 }).addTo(map); else this.car.setLatLng([car.lat, car.lng]); } else if (this.car){ this.car.remove(); this.car = null; } },
    fit(pts){ pts = pts.filter(p => p && p.lat != null); if (!pts.length) return; if (pts.length === 1) map.setView([pts[0].lat, pts[0].lng], 16); else map.fitBounds(pts.map(p => [p.lat, p.lng]), { padding: [30, 30] }); } };
  setTimeout(() => map.invalidateSize(), 200);
}
const pinHtml = (label, color, big) => `<div style="width:${big ? 38 : 28}px;height:${big ? 38 : 28}px;border-radius:50%;background:${color};color:#fff;font:900 ${big ? 18 : 12}px 'Noto Sans KR',sans-serif;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)">${label}</div>`;
async function load(){
  if (!KEY){ document.getElementById('app').innerHTML = '<div class="err">링크가 올바르지 않아요. 도장에서 받은 링크를 다시 눌러 주세요.</div>'; return; }
  let D = null;
  try { const r = await fetch(`${PUB}r_${KEY}.json`, { cache: 'no-store' }); D = await r.json(); } catch(e){}
  if (!D || !D.route){ document.getElementById('app').innerHTML = '<div class="err">노선 정보를 찾지 못했어요. 잠시 후 다시 열어 주세요.</div>'; return; }
  const R = D.route, run = D.run && D.run.day === today() ? D.run : null, st = R.stops || [];
  const walk = R.type === 'walk', icon = walk ? '🚶' : '🚐';
  document.getElementById('dojo').textContent = R.dojo || '용인대 정도 태권도 2관';
  document.getElementById('ttl').textContent = `${icon} ${R.name}`;
  document.title = `${R.name} · 차량 위치`;
  const arr = (run && run.arrivals) || {}; let last = -1; st.forEach((s, i) => { if (arr[i]) last = i; });
  const live = run && run.status === 'live', done = run && run.status === 'done';
  const pos = live && run.live, fresh = pos && Date.now() - pos.at < 120000;
  const next = live && last + 1 < st.length ? last + 1 : -1;
  const speed = walk ? 70 : 350; // m/분
  const etaTo = idx => { if (!pos || idx < 0 || idx <= last) return null; let m = dist(pos, st[last + 1]); for (let i = last + 1; i < idx; i++) m += dist(st[i], st[i + 1]); return isFinite(m) ? { m, min: Math.max(1, Math.round(m / speed)) } : null; };
  // 맨 위 큰 안내
  let big = '', cls = '', line = '';
  const mine = MY >= 0 && st[MY] ? st[MY] : null;
  if (!run){ big = '운행 전이에요'; line = mine ? `우리 아이 정류장 <b>${esc(mine.name)}</b> · 예정 <b>${esc(mine.time || '-')}</b>` : `첫 정류장 ${esc(st[0] ? st[0].name : '')} ${esc(st[0] ? st[0].time : '')} 출발 예정`; }
  else if (mine){
    if (arr[MY]){ big = `${hm(arr[MY])} 도착했어요`; cls = 'ok'; line = `<b>${esc(mine.name)}</b> (예정 ${esc(mine.time || '-')})`; }
    else if (done){ big = '운행이 끝났어요'; line = `${esc(mine.name)} 도착 기록이 없어요`; }
    else { const e = etaTo(MY); big = e ? `약 ${e.min}분 뒤 도착` : '곧 도착해요'; cls = 'go'; line = `우리 아이 정류장 <b>${esc(mine.name)}</b> · 예정 ${esc(mine.time || '-')}${MY - last - 1 > 0 ? ` · ${MY - last - 1}정거장 전` : ' · 다음 정류장'}`; }
  } else { big = done ? '운행이 끝났어요' : next >= 0 ? `다음: ${st[next].name}` : '운행 중'; cls = done ? 'ok' : 'go'; line = next >= 0 ? `예정 ${esc(st[next].time || '-')}` : ''; }
  const badge = !run ? '<span class="pill wait">운행 전</span>' : done ? `<span class="pill done">운행 끝 ${run.endedAt ? hm(run.endedAt) : ''}</span>` : fresh ? '<span class="pill live"><i class="dot"></i>실시간 운행 중</span>' : '<span class="pill lost">위치 신호 잠시 끊김</span>';
  const tl = st.map((s, i) => { const isDone = !!arr[i], isNext = i === next, isMine = i === MY;
    const carRow = live && i === last + 1 && last >= 0 ? `<div class="car">${icon} ${fresh ? '이 정류장으로 오는 중' : '위치 신호 확인 중'}${etaTo(i) ? ` · 약 ${etaTo(i).min}분` : ''}</div>` : '';
    return `${carRow}<div class="st ${isDone ? 'done' : ''} ${isNext ? 'next' : ''} ${isMine ? 'mine' : ''}"><div class="d">${isDone ? '✓' : i + 1}</div><div><div class="nm">${esc(s.name || '정류장')}${isMine ? '<span class="mytag">우리 아이</span>' : ''}</div>
      <div class="tm">예정 ${esc(s.time || '-')}${isDone ? ` · <span class="arr">${hm(arr[i])} 도착</span>` : ''}</div></div></div>`; }).join('');
  const app = document.getElementById('app');
  if (!document.getElementById('hero')) app.innerHTML = `<div class="hero" id="hero"></div><div id="map"></div><div class="tl" id="tl"></div>
    <div class="foot">5초마다 저절로 새로 고쳐져요 · 시간은 길 상황에 따라 달라질 수 있어요<br>${esc(R.dojo || '')}</div>`;
  document.getElementById('hero').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><span class="lab">${R.dir === 'out' ? '하원' : '등원'} ${walk ? '도보' : '차량'} · ${esc(R.car || '')}</span>${badge}</div>
    <div class="big ${cls}">${big}</div><div class="line">${line}</div>`;
  document.getElementById('tl').innerHTML = tl;
  await mapInit(R);
  if (M){ M.draw(st.map((s, i) => ({ ...s, html: pinHtml(i === MY ? '★' : i + 1, arr[i] ? '#16a34a' : i === MY ? '#1d4ed8' : i === next ? '#f59e0b' : '#64748b') })), pos ? { ...pos, html: pinHtml(icon, '#16a34a', true) } : null);
    const fitKey = (pos ? 'p' : '') + (run ? run.status : '');
    if (!fitted || fitted !== fitKey){ fitted = fitKey; M.fit(pos && mine && !arr[MY] ? [pos, mine] : pos ? [pos, ...st] : st); } }
}
// 지도는 한 번만 만들고, 5초마다 자료만 새로 읽기
let busy = false;
async function tick(){ if (busy || document.hidden) return; busy = true; try { await load(); } finally { busy = false; } }
tick(); setInterval(tick, 5000); document.addEventListener('visibilitychange', tick);
</script>
</body>
</html>
