/* 키오스크 화면 */
.screen{position:relative;aspect-ratio:16/10;min-height:430px;background:var(--bg);border:6px solid #1c120b;border-radius:18px;overflow:hidden;color:var(--cream);display:flex;flex-direction:column;background-image:radial-gradient(#3a2a1d 1.2px,transparent 1.2px);background-size:22px 22px}
.bar{background:var(--bar);padding:10px 18px;display:flex;align-items:center;gap:16px;border-bottom:4px solid var(--edge)}
.bar .name{font-size:22px;flex:1}
.bar .st{font-size:15px;color:#86EFAC}
.bar .clock{font-size:22px}
.pad{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px}
.hint{font-size:17px;color:var(--tan)}
.disp{width:min(340px,80%);height:62px;border:4px solid var(--edge);background:#FFF7E6;color:#5A3D2A;border-radius:14px;font-size:34px;display:flex;align-items:center;justify-content:center;letter-spacing:6px}
.keys{display:grid;grid-template-columns:repeat(3,84px);gap:8px}
.key{height:54px;font:inherit;font-size:26px;border-radius:12px;border:3px solid var(--edge);background:var(--panel);color:var(--cream);box-shadow:0 5px 0 #3b2416;cursor:pointer}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #3b2416}
.key.ok{background:var(--green);border-color:var(--greenD);box-shadow:0 5px 0 #2f5a10;color:#fff}
.key.del{background:var(--orange);border-color:var(--orangeD);box-shadow:0 5px 0 #6b3d12;color:#fff}
.key:focus-visible{outline:3px solid #fff;outline-offset:2px}
.veil{position:absolute;inset:0;background:rgba(20,12,6,.72);display:flex;align-items:center;justify-content:center;padding:10px}
.veil.done{background:rgba(43,74,30,.88)}
.panel{background:var(--panel);border:4px solid var(--edge);border-radius:22px;padding:16px 22px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.35);max-height:100%;overflow:auto}
.char{width:78px;height:96px;margin:0 auto 6px;position:relative}
.char i{position:absolute;display:block}
.nm{font-size:34px;margin:2px 0}
.rank{display:inline-flex;align-items:center;gap:8px;background:#46301F;border:3px solid var(--edge);border-radius:10px;padding:3px 12px;font-size:17px;color:var(--tan);margin:4px 0}
.muted{font-size:14px;color:var(--muted);margin:4px 0}
.row{display:flex;gap:12px;justify-content:center;margin-top:12px}
.big{font:inherit;font-size:30px;padding:12px 0;width:150px;border-radius:16px;color:#fff;cursor:pointer;border:4px solid}
.big.in{background:var(--green);border-color:var(--greenD);box-shadow:0 6px 0 #2f5a10}
.big.out{background:var(--orange);border-color:var(--orangeD);box-shadow:0 6px 0 #6b3d12}
.link{display:block;margin:10px auto 0;font:inherit;font-size:16px;background:none;border:0;color:var(--tan);cursor:pointer}
.link .ic{width:1.4em;height:1.4em;margin-right:4px}
.pill{font:inherit;font-size:19px;padding:6px 16px;border-radius:999px;border:3px solid var(--edge);background:transparent;color:var(--cream);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed=true]{background:var(--edge)}
.done h2{font-size:34px;margin:4px 0;color:#D9F99D}
.line{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;font-size:19px}
.gold{font-size:30px;color:#FDE68A}
.bonus{color:#86EFAC;font-size:16px}
.tabrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.cell{background:#46301F;border:3px solid var(--edge);border-radius:10px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.cell.lock{filter:brightness(.25)}
.cell .ic{width:70%;height:70%}
.cell .ck{position:absolute;right:2px;top:2px;width:20px;height:20px}
.legend{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px;padding:6px 10px;border:2px solid var(--edge);border-radius:10px}
.legend .ic{width:28px;height:28px}
@media (max-width:640px){.screen{aspect-ratio:auto;min-height:560px}.nm{font-size:28px}.big{width:120px;font-size:26px}.keys{grid-template-columns:repeat(3,74px)}}
</style></head><body><div class="wrap">
<h1>정도 출결 키오스크 — 아이콘 적용 미리보기</h1>
<p class="sub">앱의 실제 화면 구성(KioskScreen)을 그대로 따라 그렸고, 이모지 자리를 UI 팩 그림으로 넣었어요. 캐릭터는 앱에서 입은 옷 그대로 그려지는 자리라서 여기선 자리표시만 했어요.</p>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="screen" id="scr"></div>
<div class="legend" id="legend"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const ic=(n,c='')=>`<span class="ic i-${n} ${c}" role="img" aria-label="${n}"></span>`;
let typed='';let tab='pad';
const tabs=[['pad','① 출결번호 입력'],['pick','② 등원·하원 선택'],['done','③ 완료 화면'],['box','④ 내 보관함']];
const bar=()=>`<div class="bar"><span class="name">정도태권도</span><span class="st">${ic('dot_on')} 문자 연결</span><span class="clock">4:35 PM</span></div>`;
const char=()=>`<div class="char" aria-hidden="true"><i style="left:22px;top:0;width:34px;height:30px;background:#6B4423;border-radius:12px 12px 4px 4px"></i><i style="left:24px;top:14px;width:30px;height:24px;background:#F2C9A0;border-radius:6px"></i><i style="left:12px;top:38px;width:54px;height:36px;background:#F7F2E6;border:3px solid #c9b89a;border-radius:6px"></i><i style="left:12px;top:56px;width:54px;height:7px;background:#2A2A2A"></i><i style="left:20px;top:74px;width:14px;height:20px;background:#F7F2E6;border:3px solid #c9b89a"></i><i style="left:44px;top:74px;width:14px;height:20px;background:#F7F2E6;border:3px solid #c9b89a"></i></div>`;
const views={
pad:()=>`${bar()}<div class="pad"><div class="hint">출결번호를 눌러 주세요</div><div class="disp" aria-live="polite">${typed||'&nbsp;'}</div><div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}<button class="key del" data-k="del">지움</button><button class="key" data-k="0">0</button><button class="key ok" data-k="ok">확인</button></div></div>`,
pick:()=>views.pad().replace('class="pad"','class="pad" style="opacity:.35"')+`<div class="veil"><div class="panel">${char()}<div class="nm">김하늘</div><div class="rank">${ic('book')} Lv.7 · 초록띠</div><div class="muted">오늘 마지막: 하원 5:10 PM</div><div class="muted">형제도 같이 왔나요? (누르면 선택)</div><button class="pill" id="sib" aria-pressed="false">김하준</button><div class="row"><button class="big in" data-go="done">등원</button><button class="big out" data-go="done">하원</button></div><button class="link" data-go="box">${ic('chest')}내 보석·네임플레이트 (12)</button><button class="link" data-go="pad">취소</button></div></div>`,
done:()=>views.pad().replace('class="pad"','class="pad" style="opacity:.2"')+`<div class="veil done"><div class="panel done" style="background:#3E5F2A;border-color:#6DA33A">${char()}<h2>등원 완료!</h2><div class="nm" style="font-size:28px">김하늘</div><div class="rank">Lv.7 · EXP +10</div><div class="line gold">${ic('coin')} +30 골드</div><div class="line bonus">${ic('book')} 도감 보너스 +10</div><div class="line">${ic('dress')} 새 옷 획득!</div><div class="muted">3.5초 뒤 자동으로 닫혀요</div></div></div>`,
box:()=>views.pad().replace('class="pad"','class="pad" style="opacity:.2"')+`<div class="veil"><div class="panel" style="width:min(640px,100%)"><div style="display:flex;align-items:center;gap:12px;text-align:left"><div style="flex:1"><div style="font-size:26px">김하늘의 보관함</div><div style="font-size:18px;margin-top:4px">${ic('gold')} 1,240 골드</div><div class="bonus" style="margin-top:4px">${ic('book')} 도감 2개 활성 · 등원 +20 · 하원 +20 골드</div></div><button class="pill">닫기</button></div><div class="tabrow"><button class="pill" aria-pressed="true">보석 12/396</button><button class="pill">네임플레이트 3/40</button><button class="pill">${ic('gift')}뽑기</button><button class="pill">${ic('dress')}드레스룸</button><button class="pill">${ic('book')}도감</button></div><div class="grid">${Array.from({length:18},(_,i)=>`<div class="cell ${i>11?'lock':''}"><span class="ic i-${['gift','book','dress','coin','gold','chest'][i%6]}"></span>${i==1||i==4?'<span class="ic i-check ck"></span>':''}</div>`).join('')}</div><div class="muted" style="margin-top:8px">${ic('warn')} 서버에서 못 받았어요 · 지금은 기기 값 사용</div></div></div>`
};
function render(){ $('#tabs').innerHTML=tabs.map(([k,l])=>`<button role="tab" aria-selected="${k==tab}" data-t="${k}">${l}</button>`).join(''); $('#scr').innerHTML=views[tab](); }
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){tab=b.dataset.t;render();return}
 if(b.dataset.go){tab=b.dataset.go;render();return}
 if(b.id==='sib'){const p=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',p);b.innerHTML=(p?ic('check')+' ':'')+'김하준';return}
 if(b.dataset.k){const k=b.dataset.k; if(k==='del')typed=typed.slice(0,-1); else if(k==='ok'){if(typed){tab='pick'}} else if(typed.length<8)typed+=k; render();}
});
$('#legend').innerHTML=[['chest','보관함'],['gift','뽑기'],['dress','드레스룸'],['book','도감'],['gold','골드'],['coin','코인'],['check','체크'],['warn','경고'],['dot_on','연결'],['dot_off','꺼짐'],['arrow_l','이전'],['arrow_r','다음']].map(([n,l])=>`<div>${ic(n)}${l}</div>`).join('');
render();
</script></body></html>
