<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>마이룸</title>
<style>
/* 새싹 농장(Sprout Lands) 픽셀 UI 그림 + 복셀 마이룸 */
:root{--sky:#bfe3ff;--frame:#b07a4a;--frameD:#7a4f2a;--panel:#f3dfb4;--ink:#4a2e14;--muted:#7a5a3a;--gold:#f5b82e;--pink:#ff7aa8;--ok:#5fa83a;--disp:'Jua','Noto Sans KR',system-ui,sans-serif;color-scheme:light}
html,body{height:100%;margin:0}
body{background:#8fc95a url(../game/sprout/bg_grass.png) repeat;background-size:64px;color:var(--ink);font-family:var(--disp);overflow:auto;-webkit-user-select:none;user-select:none}
.wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px;padding:10px;align-items:start}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}}
.win{border:24px solid transparent;border-image:url(../theme/sprout/panel.png) 8 fill / 24px stretch;image-rendering:pixelated;min-width:0}
.bar{font-size:20px;padding:0 4px 8px;display:flex;align-items:center;gap:8px}
.bar small{font-size:13px;color:var(--muted);margin-left:auto}
#stage{position:relative;aspect-ratio:4/3;background:var(--sky);touch-action:none;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 3px var(--frameD)}
#stage canvas{display:block;width:100%;height:100%}
.ctl{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 0;align-items:center;justify-content:center}
.btn{font-family:var(--disp);font-size:17px;color:var(--ink);background:none;border:12px solid transparent;border-image:url(../game/sprout/btn.png) 6 fill / 12px stretch;image-rendering:pixelated;padding:0 6px;min-height:20px;cursor:pointer;line-height:1.1;white-space:nowrap}
.btn:active{border-image-source:url(../game/sprout/btn_down.png);transform:translateY(2px)}
.btn.p{filter:hue-rotate(-40deg) saturate(2.2) brightness(1.05);color:#5a1030}.btn.g{filter:saturate(1.8) brightness(1.08)}.btn.b{filter:hue-rotate(150deg) saturate(1.4)}.btn.on{filter:hue-rotate(55deg) saturate(1.8);color:#1f4a10}
.btn[disabled]{opacity:.45}
.pad{display:grid;grid-template-columns:repeat(3,52px);gap:4px}.pad .btn{padding:6px 0;font-size:20px}
#skills{max-height:120px;overflow:auto}#skills .btn{font-size:14px}
.money{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 4px;font-size:18px}.money b{color:#b9851a}
.tabs{display:flex;gap:6px;padding:0 4px 8px;flex-wrap:wrap}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;padding:0 4px 8px;max-height:46vh;overflow:auto}
.it{border:12px solid transparent;border-image:url(../game/sprout/slot.png) 6 fill / 12px stretch;image-rendering:pixelated;text-align:center;font-size:12.5px;position:relative;color:var(--ink)}
.it img,.it canvas{width:64px;height:64px;display:block;margin:0 auto 2px}
.it canvas.px{image-rendering:pixelated}
.it.placed:after{content:attr(data-b);position:absolute;left:-4px;top:-6px;font-size:10px;color:#fff;background:var(--ok);border-radius:6px;padding:0 4px}
.rare{font-size:11px;font-weight:700}
.note{font-size:13px;color:var(--muted);padding:0 4px 6px;line-height:1.5}
#bigc{display:flex;gap:12px;align-items:center;padding:0 4px 6px}#bigc canvas{width:140px;height:160px;flex:none;background:radial-gradient(#fff6dc,#e8c890);border-radius:8px;box-shadow:inset 0 0 0 3px var(--frameD)}
.tag{display:inline-block;font-size:12px;background:#fff3c4;color:#7a5600;border-radius:6px;padding:1px 6px}
.modal{position:fixed;inset:0;background:rgba(30,40,70,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.card{border:24px solid transparent;border-image:url(../theme/sprout/panel.png) 8 fill / 24px stretch;image-rendering:pixelated;width:min(380px,100%);max-height:92vh;overflow:auto;text-align:center;color:var(--ink)}
.card h3{font-weight:400;font-size:22px;margin:4px 0 6px}.card p{margin:4px 0;color:var(--muted);font-size:14px}
.card img{width:150px;height:150px}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.big3d{width:220px;height:240px;max-width:100%;display:block;margin:0 auto}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#4a2e14;color:#fff;padding:9px 16px;border-radius:12px;font-size:15px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.get{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.adm input,.adm select{font:inherit;padding:6px;border-radius:8px;border:2px solid var(--frame);margin:3px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:#8fc95a;z-index:50}
</style></head><body>
<div id="loading">마이룸 불러오는 중…</div>
<div class="wrap">
 <div class="win">
  <div class="bar">🏠 <span id="title">마이룸</span> <small id="hint">바닥을 누르면 걸어가요</small> <button class="btn" id="close">닫기</button></div>
  <div id="stage"></div>
  <div class="ctl">
   <div class="pad"><span></span><button class="btn" data-d="up">▲</button><span></span><button class="btn" data-d="left">◀</button><button class="btn" data-d="down">▼</button><button class="btn" data-d="right">▶</button></div>
   <button class="btn b" id="edit">🛠 꾸미기</button><button class="btn" id="zoom">🔍 방 전체</button>
   <button class="btn" id="rot" hidden>↻ 돌리기</button><button class="btn" id="back" hidden>📦 가방에 넣기</button>
  </div>
  <div class="ctl" id="skills"></div>
 </div>
 <div class="win">
  <div class="bar">🎒 내 가방</div>
  <div id="bigc"><canvas id="bigcv" width="280" height="320"></canvas><div><b style="font-size:20px">내 캐릭터</b><p class="note" style="padding:0;margin:4px 0">입어 보면 여기서 바로 크게 보여요</p><span id="curName" class="tag"></span></div></div>
  <div class="money">🪙 <b id="gold">0</b> 골드 <button class="btn g" id="gacha">🪑 가구 뽑기 1G</button><button class="btn g" id="cgacha">🧑 캐릭터 뽑기 10G</button></div>
  <div class="tabs"><button class="btn on" data-t="f">가구</button><button class="btn" data-t="c">캐릭터</button><button class="btn b" data-t="a" id="admTab" hidden>🔧 관리자</button></div>
  <div class="bag" id="bag"></div>
  <div class="note">물건을 누르면 <b>방에 놓기 · 판매하기</b>가 나와요. 판매는 한 번 더 물어봐요.<br>가구: MariaIsMe (CC BY 4.0) · UI: Sprout Lands</div>
 </div>
</div>
<div class="toast" id="toast"></div>
<script src="three.min.js"></script>
<script src="room.js"></script>
</body></html>
