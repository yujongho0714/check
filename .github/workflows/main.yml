yaml
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: jungdo-attend-20261026

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" > app/google-services.json; fi
          test -f app/google-services.json || { echo "::error::GOOGLE_SERVICES_JSON 비밀값이 없어요"; exit 1; }

      - name: signing key
        env:
          KEY: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$KEY" ]; then echo "$KEY" | base64 -d > app/jungdo-sign.jks; fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jungdo-attend-apk
          path: jungdo-attend-20261026/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: jungdo-attend build ${{ github.run_number }}
          files: jungdo-attend-20261026/app/build/outputs/apk/debug/app-debug.apk
